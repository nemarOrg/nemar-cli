site_name: NEMAR CLI
site_description: Command-line interface for NEMAR dataset management
site_url: https://nemar-cli.pages.dev
repo_url: https://github.com/nemarOrg/nemar-cli
repo_name: nemarOrg/nemar-cli

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Authentication: getting-started/authentication.md
  - Commands:
      - Overview: commands/index.md
      - auth: commands/auth.md
      - dataset: commands/dataset.md
      - admin: commands/admin.md
  - Guides:
      - Uploading Datasets: guides/uploading.md
      - BIDS Validation: guides/validation.md
      - Downloading Data: guides/downloading.md
  - Reference:
      - Configuration: reference/configuration.md
      - Environment Variables: reference/environment.md
      - API: reference/api.md
  - Development:
      - Setup: development/setup.md
      - Zenodo Testing: development/zenodo-testing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nemarOrg
