# NEMAR API - LEGACY personal-account config, kept as a read-only buffer
# for old CLIs still pointed at api.osc.earth/nemar. Canonical production
# config is wrangler-sccn.toml. Do not deploy CI from this file.
name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Routes intercept /nemar/* on api.osc.earth while letting /osa/* pass
# through to the origin (hedtools.ucsd.edu).
routes = [
  { pattern = "api.osc.earth/nemar", zone_id = "adce8c117d3373bda82d3aba2dfd5b13" },
  { pattern = "api.osc.earth/nemar/*", zone_id = "adce8c117d3373bda82d3aba2dfd5b13" }
]

# Scheduled cleanup: daily at 3 AM UTC
# Catalog sync runs via GitHub Action (.github/workflows/catalog-sync.yml)
[triggers]
crons = ["0 3 * * *"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "0a168b1a-1923-4436-9509-6e4a9b5bb7ae"
migrations_dir = "src/db/migrations"

# Workers AI (for dataset search embeddings)
[ai]
binding = "AI"

# Vectorize (for semantic dataset search)
[[vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index"

# Note: Rate limiting uses Cache API instead of KV to avoid daily operation limits
# KV namespace 9afb2679c6ea4ed4acd1a5916cf291d7 is no longer used

# Workers Observability. Mirrors the SCCN config so the legacy buffer is
# diagnosable too while it's still live in MAINTENANCE_MODE=read-only
# during the SCCN migration tail (see #314 Phase 11).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Environment variables
[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://api.osc.earth/nemar"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
# Sender for Resend emails. Personal account uses osc.earth domain.
# REPLY_TO intentionally unset here; nemar@osc.earth is monitored.
FROM_EMAIL = "NEMAR <nemar@osc.earth>"
# Redeploy to change. Valid: off, read-only, full. See backend/src/types/maintenance.ts.
MAINTENANCE_MODE = "read-only"

# Secrets (set via: wrangler secret put <NAME>)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - ENCRYPTION_KEY          (AES-GCM key for encrypting per-user AWS credentials in D1)
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - ZENODO_API_KEY
# - ZENODO_SANDBOX_API_KEY
# - EZID_USERNAME
# - EZID_PASSWORD
# - EZID_SANDBOX_USERNAME
# - EZID_SANDBOX_PASSWORD
# - GITHUB_WEBHOOK_SECRET
# - OPENROUTER_API_KEY
# - NEMAR_USERNAME
# - NEMAR_PASSWORD
# GitHub App credentials (epic #432, in soak -- GITHUB_ADMIN_PAT is the active fallback while any of these are unset)
# - GITHUB_APP_ID                              (GitHub App numeric ID; replaces PAT for API auth once Phase 5 lands)
# - GITHUB_APP_PRIVATE_KEY                     (PKCS#8 PEM private key for JWT signing)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_DATASETS  (installation ID on the nemarDatasets org)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_ORG       (installation ID on the nemarOrg org)

# Development environment
[env.dev]
name = "nemar-api-dev"
workers_dev = true
routes = []  # Disable custom routes for dev environment
[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db-dev"
database_id = "b0e94f45-09cb-431a-b3b6-171d5e1620f2"
migrations_dir = "src/db/migrations"

# Workers AI for dev (not inherited from top-level)
[env.dev.ai]
binding = "AI"

# Vectorize for dev (not inherited from top-level)
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index-dev"

# Observability for dev (not inherited from top-level)
[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://nemar-api-dev.shirazi-10f.workers.dev"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
FROM_EMAIL = "NEMAR <nemar@osc.earth>"
MAINTENANCE_MODE = "off"
# Note: Rate limiting is disabled in development

# Note: D1 migrations are in src/db/migrations/
# Run: wrangler d1 migrations apply nemar-db --remote
