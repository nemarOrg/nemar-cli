# NEMAR API - Cloudflare Workers Configuration
name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Route configuration for api.osc.earth/nemar/*
# This intercepts /nemar/* while letting /osa/* pass through to origin (hedtools.ucsd.edu)
routes = [
  { pattern = "api.osc.earth/nemar", zone_id = "adce8c117d3373bda82d3aba2dfd5b13" },
  { pattern = "api.osc.earth/nemar/*", zone_id = "adce8c117d3373bda82d3aba2dfd5b13" }
]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "0a168b1a-1923-4436-9509-6e4a9b5bb7ae"
migrations_dir = "src/db/migrations"

# Note: Rate limiting uses Cache API instead of KV to avoid daily operation limits
# KV namespace 9afb2679c6ea4ed4acd1a5916cf291d7 is no longer used

# Environment variables
[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://api.osc.earth/nemar"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"

# Secrets (set via: wrangler secret put <NAME>)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - ZENODO_API_KEY
# - ZENODO_SANDBOX_API_KEY
# - EZID_USERNAME
# - EZID_PASSWORD

# Development environment
[env.dev]
name = "nemar-api-dev"
workers_dev = true
routes = []  # Disable custom routes for dev environment
[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "0a168b1a-1923-4436-9509-6e4a9b5bb7ae"
migrations_dir = "src/db/migrations"

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://nemar-api-dev.shirazi-10f.workers.dev"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
# Note: Rate limiting is disabled in development

# Note: D1 migrations are in src/db/migrations/
# Run: wrangler d1 migrations apply nemar-db --remote
