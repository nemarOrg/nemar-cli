# NEMAR API - SCCN Cloudflare Account Configuration
# This is a parallel config for the SCCN account migration (Epic #314).
# Do NOT use this for production traffic until DNS cutover is complete.
#
# Usage:
#   CLOUDFLARE_ACCOUNT_ID=da8d7a2a8680dab01592bbbc6f67f12c \
#   CLOUDFLARE_API_TOKEN=<sccn-token> \
#   npx wrangler@latest -c backend/wrangler-sccn.toml <command>
#
# Or via cfman:
#   npx cfman wrangler --account sccn -c backend/wrangler-sccn.toml <command>

name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# No routes yet -- workers.dev only until DNS cutover (Phase 8)
# Future routes will use api.nemar.org zone
workers_dev = true

# Scheduled cleanup: daily at 3 AM UTC
[triggers]
crons = ["0 3 * * *"]

# D1 Database (SCCN account)
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "009b1a44-a385-4ecf-812d-ec8341587cb5"
migrations_dir = "src/db/migrations"

# Workers AI (for dataset search embeddings)
[ai]
binding = "AI"

# Vectorize (for semantic dataset search)
# TODO: Create index on SCCN account (needs Vectorize:Edit permission)
[[vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index"

# Environment variables
[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://api.nemar.org"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"

# Secrets (set via: CLOUDFLARE_ACCOUNT_ID=... CLOUDFLARE_API_TOKEN=... npx wrangler@latest secret put <NAME> -c backend/wrangler-sccn.toml)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - ENCRYPTION_KEY          (AES-GCM key -- MUST be identical to personal account)
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - GITHUB_WEBHOOK_SECRET
# - EZID_USERNAME
# - EZID_PASSWORD
# - EZID_SANDBOX_USERNAME
# - EZID_SANDBOX_PASSWORD
# - OPENROUTER_API_KEY
# - NEMAR_USERNAME
# - NEMAR_PASSWORD

# Development environment (SCCN account)
[env.dev]
name = "nemar-api-dev"
workers_dev = true
routes = []

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db-dev"
database_id = "017d8f4e-a591-4a3d-944b-01b5ffe5101d"
migrations_dir = "src/db/migrations"

# Workers AI for dev (not inherited from top-level)
[env.dev.ai]
binding = "AI"

# Vectorize for dev (not inherited from top-level)
# TODO: Create dev index on SCCN account
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index-dev"

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://nemar-api-dev.sccn-org.workers.dev"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
