# NEMAR API - SCCN Cloudflare account, canonical production config.
# Multi-account deploys use cfman; see AGENTS.md (CLAUDE.md imports it).

name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# api.nemar.org and data.nemar.org are bound as Workers Custom Domains.
# custom_domain=true lets Cloudflare auto-manage DNS + TLS for the whole
# hostname (no /* path pattern, no separate DNS record). Zone must live
# on the same account. data.nemar.org serves the BIDS-shaped HTTPS access
# layer for published datasets (epic #449); the same handlers are also
# reachable at api.nemar.org/data/* and on the workers.dev dev hostname,
# so dev testing does not require a separate dev custom domain.
routes = [
  { pattern = "api.nemar.org", custom_domain = true },
  { pattern = "data.nemar.org", custom_domain = true },
  # zarr.nemar.org: authoritative browser gateway for the Zarr serving copies
  # (epic #684). Self-contained sub-app with restricted-origin CORS + Range +
  # edge cache; dev reaches the same handlers at <workers.dev>/zarrproxy/*.
  { pattern = "zarr.nemar.org", custom_domain = true }
]
# workers.dev fallback hostname so the worker stays reachable if the
# custom domain ever misbehaves.
workers_dev = true

# Scheduled cleanup: daily at 3 AM UTC
# Two schedules share the scheduled() handler (it branches on event.cron):
#   "0 3 * * *"    daily cleanup/sweeps
#   "*/30 * * * *" auto-import tick (#775) -- self-gates to ~90 min, so the
#                  off-ticks are a single cheap D1 query. Prod only: [env.dev]
#                  now HAS its own [triggers] (epic #923 Phase 7) but carries
#                  only "0 4 * * *", and auto-import fires solely on the cron
#                  string matching AUTO_IMPORT_CRON, so it never runs in dev.
[triggers]
crons = ["0 3 * * *", "*/30 * * * *"]

# D1 Database (SCCN account)
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "009b1a44-a385-4ecf-812d-ec8341587cb5"
migrations_dir = "src/db/migrations"

# Workers AI (for dataset search embeddings)
[ai]
binding = "AI"

# Vectorize (for semantic dataset search, 384 dims, cosine, bge-small-en-v1.5)
[[vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index"

# Analytics Engine: per-request data-plane access counters (epic #695,
# dashboard.nemar.org/observability). One write-only data point per served
# archive download / zarr read, tagged with dataset_id + bytes. The
# observability dashboard reads this dataset via the account-scoped AE SQL API
# (no binding needed for reads). Optional in code (recordAccess no-ops when the
# binding is absent), so a deploy without it still serves data-plane traffic.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "nemar_access_metrics"

# LLM enrichment spend metering (one point per enrichment run; the website
# observability dashboard aggregates per hour/day via the AE SQL API).
[[analytics_engine_datasets]]
binding = "ANALYTICS_LLM"
dataset = "nemar_llm_metrics"

# Workers Observability (Workers Paid plan).
# Captures invocation logs (inbound request shape, response status, duration,
# subrequest count) and console.log output for searchable runtime telemetry.
# 100% sampling is comfortable at NEMAR's volume (admin-heavy, low QPS) under
# the 200k events/day Paid-plan cap. Drop head_sampling_rate to 0.1 if usage
# grows past the cap. Required for #393 diagnostics; without it, runtime
# subrequest counts are only readable via GraphQL Analytics API.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Environment variables
[vars]
ENVIRONMENT = "production"
# Claude Platform on AWS (Anthropic-operated Messages API, AWS Marketplace
# billing; NOT Bedrock). Used by LLM enrichment. The paired ANTHROPIC_API_KEY
# is a worker secret; both of these are required alongside it — requests
# without the anthropic-workspace-id header are rejected.
ANTHROPIC_BASE_URL = "https://aws-external-anthropic.us-east-2.api.aws"
ANTHROPIC_WORKSPACE_ID = "wrkspc_01Rayuq1JvjaMYusRvUsn6vk"
# Public base URL used to build absolute links in outbound email
# (verification, key-regeneration confirmation, etc.). The reindex enrichment
# path used to self-fetch this URL, which Cloudflare rejected at the edge
# with HTTP 522 (#523); that path now invokes enrichDataset() in-process so
# this variable no longer constrains the choice of host.
API_BASE_URL = "https://api.nemar.org"
FRONTEND_URL = "https://nemar.org"
# Authenticated app origin for ORCID OAuth redirects + post-login landings
# (#832). Distinct from FRONTEND_URL (marketing apex): the session/pending
# cookies and the ORCID redirect_uri are scoped to the app host. The ORCID
# production app's registered redirect URI MUST equal
# "${APP_BASE_URL}/auth/orcid/callback" (i.e. https://app.nemar.org/auth/orcid/callback).
APP_BASE_URL = "https://app.nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
# Hostnames that fork to the data sub-app / zarr gateway (index.ts). Set
# explicitly for parity with the staging worker (epic #923); these equal the
# built-in defaults, so prod routing is unchanged.
DATA_HOSTNAME = "data.nemar.org"
ZARR_HOSTNAME = "zarr.nemar.org"
# Sandbox (xx) dataset-ID partition (epic #923). Prod caps sandbox allocation at
# xx089999 so the dev/test staging worker (SANDBOX_ID_FLOOR="90001") owns
# xx090001-xx099999 without repo-name collisions in the shared nemarDatasets org.
SANDBOX_ID_CEILING = "89999"
# Sender + reply-to for Resend emails. The domain in FROM_EMAIL must be
# verified in the Resend account tied to RESEND_API_KEY; otherwise sends
# 403 and resolveEmailConfig logs once but does not propagate the failure.
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"
# Web-dashboard session cookie Domain attribute (#569). Pinned to
# app.nemar.org because nemarOrg/website#46 moves the authenticated
# dashboard to that subdomain. Until cutover the dashboard lives at
# nemar.org and this cookie will not actually be sent from there —
# that's fine; the cookie is only useful once the frontend ships at
# app.nemar.org. Flip via redeploy if a different host wins.
WEB_SESSION_COOKIE_DOMAIN = "app.nemar.org"
# Centralized manifest workflow flag (#557, relocated to
# nemarDatasets/.github in #564). When OFF the worker runs the legacy
# generateManifest()/version-DOI inline (synchronous, file-count-bound — times
# out the run-version-doi CI enqueue on large datasets like the 9TB on004395);
# when ON it returns 202 and dispatches a repository_dispatch to
# nemarDatasets/.github, awaiting the /webhooks/manifest-ready callback.
# Set to "true" for prod after the staged rollout was verified on
# on005385/on005752 (#751); kept here (not just on the live Worker) so a
# dev->main backend deploy can't silently revert it. Redeploy to change.
MANIFEST_VIA_CENTRAL_WORKFLOW = "true"
# Dev-range webhook mirror (epic #923). On prod only: a GitHub push to a dev-range
# (xx09NNNN) repo is re-posted verbatim to the dev worker so it dispatches for
# staging exemplars. Outbound-only + fire-and-forget; a dev outage cannot affect
# prod. Absent from [env.dev.vars] so the dev worker never mirrors.
DEV_WEBHOOK_MIRROR_URL = "https://api-test.nemar.org/webhooks/github"
# Zarr serving copy (epic #684). Base URL of the Cloudflare-cached zarr host the
# browser viewer reads and /webhooks/zarr-ready purges. Inert (purge no-ops, with
# a logged "skipped" detail) until CLOUDFLARE_ZONE_ID + the CLOUDFLARE_API_TOKEN
# secret below are also provisioned at CDN setup; safe to point at the intended
# host meanwhile.
ZARR_CACHE_BASE_URL = "https://zarr.nemar.org"
# CLOUDFLARE_ZONE_ID = "<SCCN zone id for zarr.nemar.org>"  # uncomment + set at CDN provisioning
# Automatic OpenNeuro import (#775). When "true" the */30 cron tick discovers new
# OpenNeuro datasets and imports+publishes one every ~90 min; OFF = the tick
# no-ops. ACTIVATED on prod (#775 finalize). Pinned per-env so a deploy can't
# silently flip it (the #773 lesson). Prod-only anyway: dev's [triggers] carry
# only the daily "0 4 * * *", which never matches AUTO_IMPORT_CRON, and dev
# stays "false" below.
# DISABLED 2026-07-21: the OpenNeuro import silently published datasets with
# 0-byte S3 objects (curl|aws-cp empty PUT on OpenNeuro 403; presence-only
# verification passed it). 56 datasets / ~680GB affected. Keep OFF until the
# content-copy contract + per-key size verification land. See the incident issue.
AUTO_IMPORT_ENABLED = "false"
# Pacing macro: minutes between auto-imports. 25 -> ~one import every 30 min (the
# gate sits just under the 30-min cron tick). Tunable live (wrangler deploy or the
# dashboard) without a code change -- raise it to throttle back if a run misbehaves.
AUTO_IMPORT_MIN_INTERVAL_MIN = "25"
# Import retry engine + blocklist (epic #967 Phase 2, #969). Recipient for the
# batched "dataset(s) appear inaccessible" report. Send stays OFF
# (OPENNEURO_MAINTAINER_EMAIL_ENABLED unset -> dry run: compute + audit-log,
# no send) until an operator reviews the first computed batch and flips it.
OPENNEURO_SUPPORT_EMAIL = ""
OPENNEURO_MAINTAINER_EMAIL_ENABLED = "false"

# Secrets (set via: npx cfman wrangler --account sccn secret put <NAME> -c backend/wrangler-sccn.toml)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - ENCRYPTION_KEY          (AES-GCM key -- MUST be identical to personal account; mismatch makes stored credentials undecryptable)
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - GITHUB_WEBHOOK_SECRET  (HMAC for GitHub App push webhooks; per #622)
# - NEMAR_WEBHOOK_TOKEN    (bearer for dataset-workflow callbacks: /publish-version-doi, /llm-enrich; per #622. Without this, those routes fall back to GITHUB_WEBHOOK_SECRET — works in prod, breaks fresh dev/test installs.)
# - EZID_USERNAME
# - EZID_PASSWORD
# - EZID_SANDBOX_USERNAME
# - EZID_SANDBOX_PASSWORD
# - ANTHROPIC_API_KEY      (Claude Platform on AWS long-lived key, from AWS Console ->
#                            Claude Platform on AWS -> API keys. Replaced OPENROUTER_API_KEY
#                            2026-08-18; the old OpenRouter key is disabled and its secret can
#                            be deleted once the deploy is verified.)
# - ZENODO_API_KEY
# - ZENODO_SANDBOX_API_KEY
# - MANIFEST_CALLBACK_SECRET    (HMAC key for /webhooks/manifest-ready; must
#                                match the org-level secret on nemarDatasets.
#                                Required before MANIFEST_VIA_CENTRAL_WORKFLOW
#                                can be flipped to "true" in any environment.)
# - CLOUDFLARE_API_TOKEN   (epic #684; scoped token with Zone.Cache Purge on the SCCN zone, used by
#                           /webhooks/zarr-ready cache purge. WARNING: same name as wrangler's own
#                           deploy-auth env var -- unset it from the shell before `secret put`, e.g.
#                           env -u CLOUDFLARE_API_TOKEN npx cfman wrangler --account sccn secret put CLOUDFLARE_API_TOKEN -c backend/wrangler-sccn.toml)
# GitHub App credentials (epic #432, in soak -- GITHUB_ADMIN_PAT is the active fallback while any of these are unset)
# - GITHUB_APP_ID                              (GitHub App numeric ID; replaces PAT for API auth once Phase 5 lands)
# - GITHUB_APP_PRIVATE_KEY                     (PKCS#8 PEM private key for JWT signing)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_DATASETS  (installation ID on the nemarDatasets org)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_ORG       (installation ID on the nemarOrg org)

# Development environment (SCCN account)
[env.dev]
name = "nemar-api-dev"
workers_dev = true
# Staging custom domains (epic #923), the -test mirror of the prod api/data/zarr
# hosts, all served by this one dev worker. workers_dev stays true so the
# nemar-api-dev.sccn-org.workers.dev fallback keeps working. NOTE: attaching
# these Workers Custom Domains provisions DNS + TLS on the nemar.org zone and
# requires a token with zone edit; if the CI/cfman token is Workers-only, attach
# them once in the CF dashboard before the first deploy that carries this config.
routes = [
  { pattern = "api-test.nemar.org", custom_domain = true },
  { pattern = "data-test.nemar.org", custom_domain = true },
  { pattern = "zarr-test.nemar.org", custom_domain = true }
]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db-dev"
database_id = "017d8f4e-a591-4a3d-944b-01b5ffe5101d"
migrations_dir = "src/db/migrations"

# Workers AI for dev (not inherited from top-level)
[env.dev.ai]
binding = "AI"

# Vectorize for dev (not inherited from top-level, 384 dims, cosine)
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index-dev"

# Analytics Engine for dev (not inherited from top-level). Separate dataset so
# dev data-plane traffic does not pollute the prod access metrics.
[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "nemar_access_metrics_dev"

[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS_LLM"
dataset = "nemar_llm_metrics_dev"

# Observability for dev (not inherited from top-level)
[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.vars]
ENVIRONMENT = "development"
# Claude Platform on AWS (same values as prod [vars]; env vars do not inherit).
# ANTHROPIC_API_KEY must be set as a dev-env secret separately:
#   wrangler secret put ANTHROPIC_API_KEY --env dev -c backend/wrangler-sccn.toml
ANTHROPIC_BASE_URL = "https://aws-external-anthropic.us-east-2.api.aws"
ANTHROPIC_WORKSPACE_ID = "wrkspc_01Rayuq1JvjaMYusRvUsn6vk"
# Staging API host (epic #923). Central-workflow callbacks are built from
# API_BASE_URL, so they round-trip back to this worker via api-test.nemar.org.
# (The nemar-api-dev.sccn-org.workers.dev fallback still resolves.)
API_BASE_URL = "https://api-test.nemar.org"
FRONTEND_URL = "https://test.nemar.org"
# Authenticated app origin. On staging this is the single-host test site
# (epic #923). Local ORCID dev testing needs a .dev.vars override back to
# http://localhost:4321.
APP_BASE_URL = "https://test.nemar.org"
# ORCID SSO on staging uses the PRODUCTION ORCID app, not sandbox: sandbox
# accounts are too synthetic to exercise real integration. The dev worker
# therefore carries the same prod ORCID app credentials, set as worker secrets
# (mirroring how prod stores them, not committed here):
#   ORCID_CLIENT_ID     = APP-0CJZZ8A35CR0TCLL   (public; rides in the OAuth URL)
#   ORCID_CLIENT_SECRET = <prod app secret>       (out-of-band; only holder can set)
#   ORCID_API_BASE      = https://orcid.org        (override: forces
#       getOrcidConfig()/orcidPubBase() to prod orcid.org + pub.orcid.org even
#       though ENVIRONMENT=development)
# Set them with:
#   wrangler secret put ORCID_CLIENT_ID --env dev -c backend/wrangler-sccn.toml
#   wrangler secret put ORCID_API_BASE  --env dev -c backend/wrangler-sccn.toml
#   wrangler secret put ORCID_CLIENT_SECRET --env dev -c backend/wrangler-sccn.toml
# The prod ORCID app has https://test.nemar.org/auth/orcid/callback added to its
# redirect-URI allowlist alongside app.nemar.org. Until all three secrets are set,
# getOrcidConfig() returns null and /auth/orcid/* degrades to an "unavailable"
# redirect (email-code login still works).
# Data/zarr hostnames this worker forks on (index.ts). The -test mirror of the
# prod hosts; served by this same worker via the routes above.
DATA_HOSTNAME = "data-test.nemar.org"
ZARR_HOSTNAME = "zarr-test.nemar.org"
# Origin embedded in served-manifest bytes_url links (epic #923). Points at the
# -test data host so dev-bucket-only datasets embed reachable durable links.
# Prod leaves this unset -> buildBytesUrl defaults to https://data.nemar.org, so
# prod manifests stay byte-identical. (Landing URLs resolve from FRONTEND_URL
# above, so DATASET_LANDING_BASE_URL is not needed here.)
DATA_BASE_URL = "https://data-test.nemar.org"
AWS_REGION = "us-east-2"
# Dedicated dev/staging bucket (epic #923). Physically separate from prod `nemar`
# so a dev bug can never touch real data or the prod bucket policy. Mirrors prod:
# Object Lock + versioning enabled, same public-access-block, same
# PublicReadExceptPrivate deny-list policy. The dev worker's IAM principal
# (nemar-worker-dev) has full access to nemar-dev + read-only prod, and cannot
# write/delete prod nm* data (verified via IAM policy simulation).
S3_BUCKET = "nemar-dev"
# Sandbox (xx) dataset-ID partition (epic #923). Dev/test allocates
# xx090001-xx099999; prod (SANDBOX_ID_CEILING="89999") owns xx000001-xx089999.
# The exemplar fleet pins the top sub-band (xx099900+).
SANDBOX_ID_FLOOR = "90001"
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"
# Staging zarr cache host (epic #923). URL-scoped purges of zarr-test.* can't
# touch prod cache entries; purge stays inert until CLOUDFLARE_ZONE_ID + a purge
# token are provisioned on dev (/webhooks/zarr-ready logs "purge skipped").
ZARR_CACHE_BASE_URL = "https://zarr-test.nemar.org"
# Web-dashboard session cookie Domain (#569). Kept EMPTY (host-only) on staging:
# the test.nemar.org website serves in single-host mode and mirrors Set-Cookie
# through its same-origin /auth proxy, so a host-only cookie scopes correctly to
# test.nemar.org (same as *.pages.dev previews). Avoids touching the prod auth
# cookie code paths. A Domain= value would also be rejected on the workers.dev
# fallback host used for direct dev testing.
WEB_SESSION_COOKIE_DOMAIN = ""
# Centralized manifest workflow flag (#557, relocated to
# nemarDatasets/.github in #564). Soak on dev is COMPLETE and the flag is "true"
# in prod. Dev now runs manifests INLINE (epic #923): the central workflow on
# nemarDatasets/.github writes to s3://nemar (hardcoded), so with
# S3_BUCKET=nemar-dev it would land manifests in the wrong bucket. Inline
# generation targets env.S3_BUCKET (nemar-dev) and is fine for the small staging
# exemplars (the file-count timeout wall does not bite). Phase 5 adds an
# s3_bucket dispatch param that lets the central workflow follow the bucket.
# Redeploy to change.
MANIFEST_VIA_CENTRAL_WORKFLOW = "false"
# Auto-import flag (#775). Dev has no cron triggers, so this never runs in dev;
# present only for binding consistency.
AUTO_IMPORT_ENABLED = "false"
AUTO_IMPORT_MIN_INTERVAL_MIN = "25"
# Automated publication pre-screen (#666). Enabled on SCCN dev as the soak
# target: a publish request that passes BIDS readiness dispatches
# run-prescreen on nemarDatasets/.github. Requires the PRESCREEN_CALLBACK_SECRET
# Worker secret (set on dev). Prod stays unset (dark) until promoted.
PRESCREEN_ENABLED = "true"

# Daily maintenance cron for dev/staging (epic #923 Phase 7). Offset an hour
# from prod's "0 3" so the two environments never contend. "0 4 * * *" does not
# equal AUTO_IMPORT_CRON ("*/30 * * * *"), so scheduled() takes the daily branch
# and auto-import never fires here; AUTO_IMPORT_ENABLED="false" above remains
# the second gate.
#
# The daily branch runs a REDUCED job set outside production, because this
# worker's D1 is a partial production mirror (real nm* rows, real user email
# addresses) and this worker holds a live RESEND_API_KEY. See the allowlist in
# backend/src/index.ts scheduled(): archive retry and DOI reconcile are
# production-only, and scheduledCleanup skips its staleness-email and
# import-recovery sections while narrowing sandbox deletion to the dev
# ephemeral band (xx090001-xx099899), which excludes the exemplar fleet.
[env.dev.triggers]
crons = ["0 4 * * *"]
