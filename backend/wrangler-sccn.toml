# NEMAR API - SCCN Cloudflare Account Configuration
# Canonical production config for the SCCN account (Epic #314).
# api.nemar.org is bound here as a Workers Custom Domain (Phase 8).
#
# Usage (via cfman for multi-account management):
#   npx cfman wrangler --account sccn -c backend/wrangler-sccn.toml <command>
#
# cfman accounts: neuromechanist (personal), sccn (SCCN), yooz-labs (legacy)
# Config: ~/.config/cfman/tokens.json

name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Phase 8: api.nemar.org bound as Workers Custom Domain.
# custom_domain=true lets Cloudflare auto-manage DNS + TLS for the whole
# hostname (no /* path pattern needed, no separate DNS record to create).
# Zone must be on the same SCCN account; nemar.org is.
routes = [
  { pattern = "api.nemar.org", custom_domain = true }
]
# workers.dev kept enabled during transition so the *.workers.dev URL still
# answers (gives us a buffer if the custom domain misbehaves).
workers_dev = true

# Scheduled cleanup: daily at 3 AM UTC
[triggers]
crons = ["0 3 * * *"]

# D1 Database (SCCN account)
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "009b1a44-a385-4ecf-812d-ec8341587cb5"
migrations_dir = "src/db/migrations"

# Workers AI (for dataset search embeddings)
[ai]
binding = "AI"

# Vectorize (for semantic dataset search, 384 dims, cosine, bge-small-en-v1.5)
[[vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index"

# Environment variables
[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://api.nemar.org"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
# Sender + reply-to for Resend emails (SCCN nemar.org sender).
# Requires nemar.org domain verified in SCCN Resend account before deploy;
# otherwise Resend 403s every send and failures are silent (caught per-site).
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"

# Secrets (set via: npx cfman wrangler --account sccn secret put <NAME> -c backend/wrangler-sccn.toml)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - ENCRYPTION_KEY          (AES-GCM key -- MUST be identical to personal account; mismatch makes stored credentials undecryptable)
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - GITHUB_WEBHOOK_SECRET
# - EZID_USERNAME
# - EZID_PASSWORD
# - EZID_SANDBOX_USERNAME
# - EZID_SANDBOX_PASSWORD
# - OPENROUTER_API_KEY
# - NEMAR_USERNAME
# - NEMAR_PASSWORD
# - ZENODO_API_KEY
# - ZENODO_SANDBOX_API_KEY

# Development environment (SCCN account)
[env.dev]
name = "nemar-api-dev"
workers_dev = true
routes = []

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db-dev"
database_id = "017d8f4e-a591-4a3d-944b-01b5ffe5101d"
migrations_dir = "src/db/migrations"

# Workers AI for dev (not inherited from top-level)
[env.dev.ai]
binding = "AI"

# Vectorize for dev (not inherited from top-level, 384 dims, cosine)
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index-dev"

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://nemar-api-dev.sccn-org.workers.dev"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"
