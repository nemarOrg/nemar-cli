# NEMAR API - SCCN Cloudflare account, canonical production config.
# Multi-account deploys use cfman; see AGENTS.md (CLAUDE.md imports it).

name = "nemar-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# api.nemar.org and data.nemar.org are bound as Workers Custom Domains.
# custom_domain=true lets Cloudflare auto-manage DNS + TLS for the whole
# hostname (no /* path pattern, no separate DNS record). Zone must live
# on the same account. data.nemar.org serves the BIDS-shaped HTTPS access
# layer for published datasets (epic #449); the same handlers are also
# reachable at api.nemar.org/data/* and on the workers.dev dev hostname,
# so dev testing does not require a separate dev custom domain.
routes = [
  { pattern = "api.nemar.org", custom_domain = true },
  { pattern = "data.nemar.org", custom_domain = true }
]
# workers.dev fallback hostname so the worker stays reachable if the
# custom domain ever misbehaves.
workers_dev = true

# Scheduled cleanup: daily at 3 AM UTC
[triggers]
crons = ["0 3 * * *"]

# D1 Database (SCCN account)
[[d1_databases]]
binding = "DB"
database_name = "nemar-db"
database_id = "009b1a44-a385-4ecf-812d-ec8341587cb5"
migrations_dir = "src/db/migrations"

# Workers AI (for dataset search embeddings)
[ai]
binding = "AI"

# Vectorize (for semantic dataset search, 384 dims, cosine, bge-small-en-v1.5)
[[vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index"

# Workers Observability (Workers Paid plan).
# Captures invocation logs (inbound request shape, response status, duration,
# subrequest count) and console.log output for searchable runtime telemetry.
# 100% sampling is comfortable at NEMAR's volume (admin-heavy, low QPS) under
# the 200k events/day Paid-plan cap. Drop head_sampling_rate to 0.1 if usage
# grows past the cap. Required for #393 diagnostics; without it, runtime
# subrequest counts are only readable via GraphQL Analytics API.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Environment variables
[vars]
ENVIRONMENT = "production"
# Public base URL used to build absolute links in outbound email
# (verification, key-regeneration confirmation, etc.). The reindex enrichment
# path used to self-fetch this URL, which Cloudflare rejected at the edge
# with HTTP 522 (#523); that path now invokes enrichDataset() in-process so
# this variable no longer constrains the choice of host.
API_BASE_URL = "https://api.nemar.org"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
# Sender + reply-to for Resend emails. The domain in FROM_EMAIL must be
# verified in the Resend account tied to RESEND_API_KEY; otherwise sends
# 403 and resolveEmailConfig logs once but does not propagate the failure.
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"
# Web-dashboard session cookie Domain attribute (#569). Pinned to
# app.nemar.org because nemarOrg/website#46 moves the authenticated
# dashboard to that subdomain. Until cutover the dashboard lives at
# nemar.org and this cookie will not actually be sent from there —
# that's fine; the cookie is only useful once the frontend ships at
# app.nemar.org. Flip via redeploy if a different host wins.
WEB_SESSION_COOKIE_DOMAIN = "app.nemar.org"
# Centralized manifest workflow flag (#557, relocated to
# nemarDatasets/.github in #564). Default OFF; flip to "true"
# per-environment for staged rollout after dev soak. When OFF the worker
# runs the legacy generateManifest() inline; when ON it dispatches a
# repository_dispatch to nemarDatasets/.github and awaits the callback.
# Redeploy to change.
MANIFEST_VIA_CENTRAL_WORKFLOW = "false"
# #646 Phase 3: read from the datasets source of truth. Stays "false" in prod
# until a separate production cutover; flipped "true" only in dev for now.
READ_FROM_DATASETS = "false"

# Secrets (set via: npx cfman wrangler --account sccn secret put <NAME> -c backend/wrangler-sccn.toml)
# - GITHUB_ADMIN_PAT
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - ENCRYPTION_KEY          (AES-GCM key -- MUST be identical to personal account; mismatch makes stored credentials undecryptable)
# - RESEND_API_KEY
# - TEST_BYPASS_TOKEN
# - GITHUB_WEBHOOK_SECRET  (HMAC for GitHub App push webhooks; per #622)
# - NEMAR_WEBHOOK_TOKEN    (bearer for dataset-workflow callbacks: /publish-version-doi, /llm-enrich; per #622. Without this, those routes fall back to GITHUB_WEBHOOK_SECRET — works in prod, breaks fresh dev/test installs.)
# - EZID_USERNAME
# - EZID_PASSWORD
# - EZID_SANDBOX_USERNAME
# - EZID_SANDBOX_PASSWORD
# - OPENROUTER_API_KEY
# - NEMAR_USERNAME
# - NEMAR_PASSWORD
# - ZENODO_API_KEY
# - ZENODO_SANDBOX_API_KEY
# - MANIFEST_CALLBACK_SECRET    (HMAC key for /webhooks/manifest-ready; must
#                                match the org-level secret on nemarDatasets.
#                                Required before MANIFEST_VIA_CENTRAL_WORKFLOW
#                                can be flipped to "true" in any environment.)
# GitHub App credentials (epic #432, in soak -- GITHUB_ADMIN_PAT is the active fallback while any of these are unset)
# - GITHUB_APP_ID                              (GitHub App numeric ID; replaces PAT for API auth once Phase 5 lands)
# - GITHUB_APP_PRIVATE_KEY                     (PKCS#8 PEM private key for JWT signing)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_DATASETS  (installation ID on the nemarDatasets org)
# - GITHUB_APP_INSTALLATION_ID_NEMAR_ORG       (installation ID on the nemarOrg org)

# Development environment (SCCN account)
[env.dev]
name = "nemar-api-dev"
workers_dev = true
routes = []

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nemar-db-dev"
database_id = "017d8f4e-a591-4a3d-944b-01b5ffe5101d"
migrations_dir = "src/db/migrations"

# Workers AI for dev (not inherited from top-level)
[env.dev.ai]
binding = "AI"

# Vectorize for dev (not inherited from top-level, 384 dims, cosine)
[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "nemar-dataset-index-dev"

# Observability for dev (not inherited from top-level)
[env.dev.observability]
enabled = true
head_sampling_rate = 1

[env.dev.observability.logs]
enabled = true
invocation_logs = true

[env.dev.vars]
ENVIRONMENT = "development"
API_BASE_URL = "https://nemar-api-dev.sccn-org.workers.dev"
FRONTEND_URL = "https://nemar.org"
AWS_REGION = "us-east-2"
S3_BUCKET = "nemar"
FROM_EMAIL = "NEMAR Archive <noreply@nemar.org>"
REPLY_TO = "info@nemar.org"
# Web-dashboard session cookie Domain (#569). Empty in dev so the
# cookie is host-only for nemar-api-dev.sccn-org.workers.dev — any
# explicit value would refuse to scope to a workers.dev hostname.
WEB_SESSION_COOKIE_DOMAIN = ""
# Centralized manifest workflow flag (#557, relocated to
# nemarDatasets/.github in #564). SCCN dev is the designated soak target.
# MANIFEST_CALLBACK_SECRET is set on both the Worker and nemarDatasets org
# (visibility=all repos) as of 2026-05-18. Promote to prod after a week of
# clean runs against this dev environment.
# Redeploy to change.
MANIFEST_VIA_CENTRAL_WORKFLOW = "true"
# #646 Phase 3: dev reads from the datasets source of truth (FTS5 + id-only
# Vectorize hydration). Dev is the validation surface for the consolidation.
READ_FROM_DATASETS = "true"
