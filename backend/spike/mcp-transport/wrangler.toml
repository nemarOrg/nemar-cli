name = "mcp-transport-spike"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Imports fixtures/chunk.bin as an ArrayBuffer default export (src/types.d.ts
# declares the shape for TypeScript).
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = true
