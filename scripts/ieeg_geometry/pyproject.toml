[project]
name = "ieeg-geometry"
version = "0.1.0"
description = "Readers, surface reference data and a geometric verifier for iEEG electrode positions"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.13", "nibabel>=5.2"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ieeg_geometry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: downloads full public surfaces into a cache outside the repository; CI skips it"]
