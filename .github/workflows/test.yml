name: Tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '*.md'

# Permissions needed for dorny/paths-filter to access PR files
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check what files changed to determine which tests to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      backend: ${{ steps.filter.outputs.backend }}
      tests: ${{ steps.filter.outputs.tests }}
      email: ${{ steps.filter.outputs.email }}
      zarr: ${{ steps.filter.outputs.zarr }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
            backend:
              - 'backend/**'
            tests:
              - 'test/**'
            # Email + passwordless auth surface (#569 / #572 / #595).
            # Gates the passwordless-auth-test job below — that suite
            # triggers real Resend API calls and burns the daily quota,
            # so it must not run on unrelated PRs. Keep this list in
            # lockstep with the modules that produce or consume the
            # passwordless cookie / email send paths.
            email:
              - 'backend/src/services/email.ts'
              - 'backend/src/services/auth-code.ts'
              - 'backend/src/services/web-session.ts'
              - 'backend/src/middleware/webSession.ts'
              - 'backend/src/middleware/auth.ts'
              - 'backend/src/routes/auth-web.ts'
              # admin/users.ts hosts the /admin/test-fixtures/seed-web-user
              # endpoint the passwordless suite depends on; if the
              # fixture changes alone, the suite must still run.
              - 'backend/src/routes/admin/users.ts'
              - 'backend/src/db/migrations/0026_passwordless_auth.sql'
              - 'backend/src/db/migrations/0015_email_preferences.sql'
              - 'backend/src/db/migrations/0017_broadcast_emails.sql'
              - 'test/auth-passwordless.test.ts'
              - '.github/workflows/test.yml'
            # Zarr conversion engine (epic #1108 Phase 1 / #1109). Repatriated
            # from nemarDatasets/.github, where test-generate-zarr.yml used to
            # run these; that workflow is retired and this filter replaces it.
            zarr:
              - 'scripts/zarr/**'

  # Zarr conversion engine tests (epic #1108 Phase 1 / #1109).
  # Pure no-mock unit assertions over generate_zarr.py's helpers (path
  # classification, incremental worklist, index merge, annex-key parsing), the
  # SQLite queue, the non-raw store purge, and the power-line-frequency patch.
  # biosigIO and zarr are lazy-imported inside the I/O functions, so these need
  # no dependency install at all.
  #
  # This replaces nemarDatasets/.github's test-generate-zarr.yml, which ran only
  # three of the four files -- test_patch_power_line_frequency.py was covered by
  # no workflow anywhere, so moving the engine here closes that gap.
  zarr-python-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.zarr == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Converter helper tests
        run: python scripts/zarr/test_generate_zarr.py

      - name: Queue tests
        run: python scripts/zarr/test_zarr_queue.py

      - name: Non-raw store purge tests
        run: python scripts/zarr/test_purge_non_raw_stores.py

      - name: Power-line-frequency patch tests
        run: python scripts/zarr/test_patch_power_line_frequency.py

  # Type check and lint - always runs on code changes
  lint:
    runs-on: ubuntu-latest
    needs: changes
    # Matches unit-pure's trigger so that, as a required check, lint never
    # "skips" on a backend-only PR (a skipped required check blocks merges).
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

  # Unit tests - runs on CLI or test changes
  # Tier 1 (REQUIRED on dev + main): pure, deterministic tests with no network.
  # Auto-classified as every non-e2e file that does NOT hit the live backend
  # (no testRequest / TEST_API_URL / runCli) -- new tests route themselves, no
  # renames. Fast (~1 min) and never flaky, so this is the gate for landing
  # into dev. See https://docs.nemar.org/admin/operations/access-policies/ for the tiering rationale.
  unit-pure:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Install backend dependencies
        run: cd backend && bun install

      - name: Run pure unit tests (no live backend)
        run: |
          # Deliberately no TEST_API_URL / secrets: these tests don't touch the
          # backend, so a misclassified file fails loudly here instead of
          # silently flaking in the wrong tier.
          shopt -s nullglob
          files=()
          for f in test/*.test.ts backend/test/*.test.ts; do
            base="$(basename "$f")"
            case "$base" in
              e2e-sandbox.test.ts|e2e-upload.test.ts|zenodo-sandbox.test.ts|ezid.test.ts|ezid-sandbox.test.ts|auth-passwordless.test.ts) continue;;
              # *.integration.test.ts hit external networks (e.g. live DataCite/
              # Crossref) and are non-deterministic; they must NOT gate the pure
              # (required, offline) tier or, via test-gate, the prod deploy.
              *.integration.test.ts) continue;;
            esac
            if grep -Eq 'testRequest|TEST_API_URL|runCli\(' "$f"; then continue; fi
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No pure test files matched" >&2; exit 1; fi
          echo "Running ${#files[@]} pure test files"
          bun test "${files[@]}"

  # Tier 2 (SOFT on dev, REQUIRED on main): integration tests that hit the LIVE
  # dev backend (real AWS STS / D1 / network). These flake transiently (a
  # different ~2 of ~1600 each run), so --retry=2 rides over infra hiccups while
  # a genuinely broken test still fails all 3 attempts. NOT a required check on
  # dev (a transient flake must not block a PR); the dev->main gate makes it
  # required, and nightly-tests.yml provides scheduled hard coverage + issue.
  integration-dev:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true'
    env:
      TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
      TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
      TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
      TEST_BYPASS_TOKEN: ${{ secrets.TEST_BYPASS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Install backend dependencies
        run: cd backend && bun install

      - name: Run live-backend integration tests (--retry for transient flakes)
        run: |
          # Every non-e2e file that DOES hit the live dev backend, including
          # cli.test.ts (runCli spawns the binary against the backend).
          shopt -s nullglob
          files=()
          for f in test/*.test.ts backend/test/*.test.ts; do
            base="$(basename "$f")"
            case "$base" in
              e2e-sandbox.test.ts|e2e-upload.test.ts|zenodo-sandbox.test.ts|ezid.test.ts|ezid-sandbox.test.ts|auth-passwordless.test.ts) continue;;
              # *.integration.test.ts (external-network tests) run here, where
              # --retry=2 --timeout 30000 lets a transient API hiccup retry
              # instead of turning a required check red.
              *.integration.test.ts) files+=("$f"); continue;;
            esac
            if grep -Eq 'testRequest|TEST_API_URL|runCli\(' "$f"; then files+=("$f"); fi
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No integration test files matched" >&2; exit 1; fi
          echo "Running ${#files[@]} integration test files"
          # --timeout 30000 (vs 5000ms default): these hit the live dev backend
          # and spawn the CLI via `bun run src/index.ts`; cold D1 reads and the
          # per-invocation transpile can momentarily exceed 5s, surfacing as
          # 5000ms timeouts / exit-143 SIGTERMs rather than real failures (#672).
          bun test --retry=2 --timeout 30000 "${files[@]}"

  # Python script tests for scripts/emit_manifest.py + helpers ran here
  # under #557 (the central manifest workflow). Those scripts now live in
  # nemarDatasets/.github (#564) where the workflow itself runs; the
  # python-unit-test job moved there as
  # nemarDatasets/.github/.github/workflows/test-emit-manifest.yml.

  # API integration tests - uses dev environment (no rate limiting)
  api-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run API tests against dev environment
        env:
          # Use dev API - no rate limiting
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
        # --timeout 20000 (vs 5000ms default): api.test.ts hits the live dev
        # backend; a cold D1 read replica occasionally pushes a request past 5s
        # (e.g. the DOI-info / doi/concept tests, #672). The endpoints are fast
        # in isolation, so 20s asserts correctness without cold-start flake.
        run: bun test --timeout 20000 test/api.test.ts

  # E2E Sandbox tests - installs CLI from npm and runs against sandbox
  # Runs on PRs to dev (basic) and main (comprehensive)
  e2e-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Determine npm tag and wait for publish
        id: npm-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Looking for PR${PR_NUMBER} package with commit ${SHORT_SHA}..."

          # Wait for npm-publish workflow to complete with matching version
          for i in {1..30}; do
            VERSION=$(timeout 10 npm view nemar-cli@PR${PR_NUMBER} version 2>/dev/null || echo "")
            if [[ "$VERSION" == *"$SHORT_SHA"* ]]; then
              echo "Found matching version: $VERSION"
              echo "tag=PR${PR_NUMBER}" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i: version=$VERSION (waiting for $SHORT_SHA)..."
            sleep 10
          done

          # Fallback to dev if PR version not found after 5 minutes
          echo "::warning::PR-specific package PR${PR_NUMBER} with commit ${SHORT_SHA} not found after 5 minutes. Falling back to 'dev' tag. E2E tests may not be testing actual PR changes!"
          echo "tag=dev" >> $GITHUB_OUTPUT

      - name: Install CLI from npm
        run: |
          bun install -g nemar-cli@${{ steps.npm-tag.outputs.tag }}
          echo "Installed version: $(nemar --version)"

      - name: Install test dependencies
        run: bun install

      - name: Run E2E sandbox tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: bun test test/e2e-sandbox.test.ts

  # E2E upload tests - full upload workflow, only on main push
  e2e-upload:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.cli == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install DataLad and git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
          pip install datalad

      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install dependencies
        run: bun install

      - name: Run E2E upload tests against dev environment
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bun test test/e2e-upload.test.ts

  # Zenodo sandbox tests - verifies DOI creation workflows
  zenodo-sandbox-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run Zenodo sandbox tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          RUN_ZENODO_TESTS: "true"
          TEST_DATASET_ID: "nm099999"
          ZENODO_SANDBOX_API_KEY: ${{ secrets.ZENODO_SANDBOX_API_KEY }}
        run: bun test test/zenodo-sandbox.test.ts

  # Passwordless email-code auth tests - only on PRs/pushes to main.
  # Each run triggers real Resend API calls (even to .test addresses),
  # so running on every dev PR exhausts the daily email quota quickly.
  #
  # Path-gated on the `email` filter so PRs that don't touch the
  # passwordless or email surface (the vast majority of nemar-cli
  # changes) skip the suite entirely. Without the filter, a backend
  # change in any unrelated file would re-trigger this job on the dev
  # branch and burn the daily Resend quota even though no email code
  # was touched. The main-branch / PR-base-main gate stays in place as
  # a second backstop.
  passwordless-auth-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.email == 'true' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run passwordless auth tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_BYPASS_TOKEN: ${{ secrets.TEST_BYPASS_TOKEN }}
          # Required by the #595 / #572 cases: `seedWebUser` and the
          # no-row-created admin /users lookup both authenticate as
          # admin via TEST_ADMIN_API_KEY. Without it the helper 401s
          # before the test body runs.
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
        run: bun test test/auth-passwordless.test.ts
