name: Tests

on:
  push:
    # Epic integration branches (epic-dev workflow) get the same push CI as dev
    # so each squash-merged phase is tested where it lands.
    branches: [main, dev, 'feature/issue-*-epic-*']
    # NARROWED FROM '*.md' (#1339). A glob does not cross `/`, so `*.md` meant
    # every ROOT markdown file -- AGENTS.md, CLAUDE.md, README.md -- skipped this
    # workflow entirely, before `changes` was ever evaluated. That silently
    # disabled the paths filter below for the exact files it names: a pull
    # request editing only AGENTS.md ran no jobs at all. Verified on dev commit
    # 02b42189 (CHANGELOG-only), which has no Tests run.
    #
    # `paths-ignore` has no exception syntax, so it cannot be patched in place --
    # it has to name only what is genuinely inert. CHANGELOG.md is; the agent
    # files are not, and README.md carries four of the repo's five docs pointers.
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    # Phase PRs target the epic branch, not dev; without this pattern they ran
    # with no test workflow at all (found on epic #1181, 2026-09-02).
    branches: [main, dev, 'feature/issue-*-epic-*']
    # No paths-ignore here, unlike push: `lint` and `unit-pure` are required
    # checks on dev and main, so a pull request that skipped this workflow could
    # never report them and could not merge. A CHANGELOG-only release entry
    # (#1503) was the first to hit it.

# Permissions needed for dorny/paths-filter to access PR files
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check what files changed to determine which tests to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      backend: ${{ steps.filter.outputs.backend }}
      tests: ${{ steps.filter.outputs.tests }}
      email: ${{ steps.filter.outputs.email }}
      zarr: ${{ steps.filter.outputs.zarr }}
      shared: ${{ steps.filter.outputs.shared }}
      decisions: ${{ steps.filter.outputs.decisions }}
      agentdocs: ${{ steps.filter.outputs.agentdocs }}
      neurobagel_deploy: ${{ steps.filter.outputs.neurobagel_deploy }}
      scrub: ${{ steps.filter.outputs.scrub }}
      # The ONE predicate for "the scrub suites must run", read by both `scrub-tools-shard` and
      # `scrub-tools` below so the shards and the check that gates on them cannot disagree about
      # whether they were due. It is the same condition `scrub-tools` always had: the toolchain
      # and the scanner (`scrub`), or the wire contract they import (`shared`).
      scrub_suites: ${{ steps.filter.outputs.scrub == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
              # CI-support scripts that ship and are tested alongside the CLI
              # (e.g. scripts/ci/probe-github-token.ts) but live outside src/.
              # Without this, a change to the probe alone matched no category,
              # so unit-pure -- the job that actually runs
              # test/probe-github-token.test.ts -- silently skipped it.
              - 'scripts/ci/**'
              # The Neurobagel gatherer, vocabulary generator and golden regenerator
              # (epic #1586) are imported by test/neurobagel-*.test.ts and type-checked
              # with the root tsconfig; a change to them alone must run lint and unit-pure.
              - 'scripts/neurobagel/**'
            backend:
              - 'backend/**'
            tests:
              - 'test/**'
            # The Neurobagel node deployment (epic #1586, ADR 0082). Its scripts, schema
            # and compose overlay are exercised by test/neurobagel-node-deploy.unit.test.ts,
            # and the generator under it is type-checked with the test, so a change to
            # deploy/neurobagel alone must run `lint` and `unit-pure`. It is deliberately
            # NOT part of `tests:` above: that output also starts the backend integration
            # and live jobs, which a deployment script cannot affect and which spend
            # real quota.
            neurobagel_deploy:
              - 'deploy/neurobagel/**'
            # The in-place privacy scrub toolchain (epic #1610, ADR 0085) and the
            # identifier scanner it shares code with. These are irreversible tools
            # (they delete locked objects and rewrite published history), so a change
            # to any of them must run their suites, and nothing else here globs
            # test/scrub/**: `unit-pure` lists test/*.test.ts only.
            scrub:
              - 'scripts/scrub/**'
              - 'test/scrub/**'
              - 'shared/identifier-*.ts'
              - 'scripts/identifier-fleet-*.ts'
              - 'test/identifier-*.test.ts'
              # The Zarr converter writes the store members the zarr stage removes and the
              # members it accepts (KNOWN_BENIGN in scripts/scrub/s3/zarr-json.ts): a change to
              # what it writes must run the scrub suites.
              - 'scripts/zarr/**'
              # Self-reference, mirroring the `email` filter below: the sharded job and its
              # aggregator are defined in this file, and editing only them left `scrub` false,
              # so the one change that could break the scrub CI never ran the scrub CI.
              - '.github/workflows/test.yml'
            # shared/ is imported by BOTH src/ and backend/ but matched by
            # neither filter, so a PR touching only shared/** -- the wire
            # contract, the facet vocabulary, the two published Zarr JSON
            # Schemas -- ran zero test jobs and merged green having been
            # compiled by nothing. Wired into lint, unit-pure and the
            # backend-facing jobs below.
            shared:
              - 'shared/**'
            # Email + passwordless auth surface (#569 / #572 / #595).
            # Gates the passwordless-auth-test job below — that suite
            # triggers real Resend API calls and burns the daily quota,
            # so it must not run on unrelated PRs. Keep this list in
            # lockstep with the modules that produce or consume the
            # passwordless cookie / email send paths.
            email:
              - 'backend/src/services/email.ts'
              - 'backend/src/services/auth-code.ts'
              - 'backend/src/services/web-session.ts'
              - 'backend/src/middleware/webSession.ts'
              - 'backend/src/middleware/auth.ts'
              - 'backend/src/routes/auth-web.ts'
              # admin/users.ts hosts the /admin/test-fixtures/seed-web-user
              # endpoint the passwordless suite depends on; if the
              # fixture changes alone, the suite must still run.
              - 'backend/src/routes/admin/users.ts'
              - 'backend/src/db/migrations/0026_passwordless_auth.sql'
              - 'backend/src/db/migrations/0015_email_preferences.sql'
              - 'backend/src/db/migrations/0017_broadcast_emails.sql'
              - 'test/auth-passwordless.test.ts'
              - '.github/workflows/test.yml'
            # ADRs and the index that lists them. `test/adr-index.unit.test.ts`
            # exists to validate exactly these files -- gapless numbering, every
            # file present in README.md and vice versa, a superseded ADR naming a
            # target that exists -- and until this filter it NEVER RAN when they
            # changed, because .context/** matched nothing. Two ADR pull requests
            # in a row (#1292, #1330) therefore showed a fully green check list
            # while the one test that could have failed was skipped; both were
            # verified by hand instead. Same shape as the `shared:` gap above,
            # same fix.
            decisions:
              - '.context/decisions/**'
              - 'test/adr-index.unit.test.ts'
              - '.github/workflows/test.yml'
            # The agent-facing files and the guard that keeps their docs pointers
            # honest (epic #1336 phase 1, ADR 0057). THIRD TIME FOR THIS GAP:
            # nothing here matched `AGENTS.md` or `.rules/**`, so a pull request
            # editing only those ran zero jobs and `test/docs-links.unit.test.ts`
            # would never have run on exactly the change it exists to police --
            # the same shape as the `shared:` and `decisions:` gaps above, both
            # of which shipped green-and-vacuous before they were found.
            agentdocs:
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'README.md'
              - '.rules/**'
              - 'test/docs-links.unit.test.ts'
              - '.github/workflows/test.yml'
            # Zarr conversion engine (epic #1108 Phase 1 / #1109). Repatriated
            # from nemarDatasets/.github, where test-generate-zarr.yml used to
            # run these; that workflow is retired and this filter replaces it.
            zarr:
              - 'scripts/zarr/**'
              # scripts/mcp/ rides this filter rather than getting its own: it is
              # the repo's other operational Python, and this is the only job
              # with uv set up. It cannot be RUN in CI (its whole purpose is to
              # talk to a live host), but it can be linted, which is the same
              # reasoning as the shellcheck step below -- a file in the repo that
              # nothing checks is where an infinite loop shipped last time.
              - 'scripts/mcp/**'
              # patch_duration.py imports generate_zarr (_run,
              # materialize_recording), so it moved here with it (#1109).
              - 'scripts/patch_duration.py'
              - 'scripts/test_patch_duration.py'
              # test_generate_zarr.py scans every non-test script under
              # scripts/ for a biosigIO store writer called outside
              # generate_zarr.write_store (#1626), so a new script anywhere
              # under scripts/ must run that scan on the pull request adding it.
              - 'scripts/**/*.py'
              # Self-reference, mirroring the `email` filter above: without it,
              # editing only these jobs (a python bump, a new step, a typo in the
              # install line) leaves zarr == 'false' and skips them silently.
              - '.github/workflows/test.yml'

  # Zarr conversion engine tests (epic #1108 Phase 1 / #1109).
  # Pure no-mock unit assertions over generate_zarr.py's helpers (path
  # classification, incremental worklist, index merge, annex-key parsing), the
  # SQLite queue, the non-raw store purge, and the power-line-frequency patch.
  # biosigIO and zarr are lazy-imported inside the I/O functions, so these need
  # no dependency install at all.
  #
  # This replaces nemarDatasets/.github's test-generate-zarr.yml, which ran only
  # three of the four files -- test_patch_power_line_frequency.py was covered by
  # no workflow anywhere, so moving the engine here closes that gap.
  zarr-python-test:
    runs-on: ubuntu-latest
    # The pool-recovery tests drive real subprocesses; if the executor ever
    # wedges, fail in minutes rather than burning GitHub's 360-minute default.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.zarr == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # hallu-zarr.sh matches this job's paths filter but nothing checked it.
      # Its argument parser shipped an infinite loop and a silent scope-widening
      # bug during this epic, both found by hand-testing on the production node.
      - name: Shellcheck the driver script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n scripts/zarr/hallu-zarr.sh
          shellcheck --severity=warning scripts/zarr/hallu-zarr.sh

      # scripts/mcp/verify_streamable_http.py talks to a live MCP host, so CI
      # cannot run it. Linting it is still worth a few seconds: it shipped a
      # default URL missing the transport path, which no test could have caught
      # and which made the script unable to connect at all. Ruff parses the file,
      # so this covers syntax as well as lint. The flags match the ones its own
      # docstring records, and py312 is the version its shebang pins.
      - name: Lint the MCP operational scripts
        run: uvx ruff check --target-version py312 --line-length 100 --extend-select E501,I,UP,B scripts/mcp/

      # jsonschema + pyarrow ONLY -- deliberately not the whole requirements.txt.
      # This job is the fast, pure-Python tier: it has no biosigIO/MNE/zarr and
      # the tests that need them self-skip (`patch-duration-test` below is the
      # job that installs the real stack). But the index/manifest schema
      # self-check is pure Python, and without the validator installed those
      # tests do not fail -- they ERROR on the import, and `validate_document`'s
      # deliberate "warn and continue" degradation makes the positive cases pass
      # vacuously. A schema gate nobody can see failing is not a gate (#1059).
      #
      # pyarrow is here for the same reason and no other: the events.parquet
      # schema, ordering, and bounded-memory write tests (#1060) need nothing
      # from biosigIO -- they build rows from text and write a real file -- so
      # they belong in this tier, and the converter's own "warn and publish no
      # events file" degradation would otherwise make a broken writer look
      # exactly like a dataset with no events.
      - name: Install jsonschema and pyarrow
        run: uv pip install --system "jsonschema>=4.21" "pyarrow>=15.0"

      - name: Converter helper tests
        run: python scripts/zarr/test_generate_zarr.py

      - name: Queue tests
        run: python scripts/zarr/test_zarr_queue.py

      - name: Non-raw store purge tests
        run: python scripts/zarr/test_purge_non_raw_stores.py

      - name: Collapsed-channel detector tests
        run: python scripts/zarr/test_find_collapsed_channel_stores.py

      - name: Power-line-frequency patch tests
        run: python scripts/zarr/test_patch_power_line_frequency.py

      # --test / --print-config config-resolution tests (epic #1181 phase 3).
      # pytest, not the plain `python <file>` the tests above use -- this file
      # drives real subprocesses against hallu-zarr.sh rather than importing
      # pure helpers, so parametrized cases (the six guard-rail conditions,
      # each with normalized/case-insensitive variants) read better as pytest
      # cases than as a unittest subclass.
      - name: Hallu zarr --test config tests
        run: cd scripts/zarr && uv run --with pytest pytest test_hallu_zarr_config.py -v

  # The FULL converter suite, plus the tier-2 duration backfill
  # (scripts/patch_duration.py) it was originally created for (#1109).
  #
  # The job name is kept for the required-check configuration; its scope is
  # deliberately wider than the name. `zarr-python-test` above is the fast
  # pure-Python tier and installs only jsonschema + pyarrow, so five test
  # classes -- 43 tests covering real-recording conversion, events.parquet
  # publication end to end, convert_one, and the sample-index rate-ratio
  # cases -- raised SkipTest on EVERY CI run and were reported as
  # "skipped=9" in a green job. This job already installs the real stack
  # (biosigIO + pyedflib) for the duration tests, so running the converter
  # suite here is what actually executes them.
  patch-duration-test:
    runs-on: ubuntu-latest
    # The pool-recovery tests drive real subprocesses; if the executor ever
    # wedges, fail in minutes rather than burning GitHub's 360-minute default.
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.zarr == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install biosigIO + pyedflib + the schema/parquet validators
        run: |
          uv pip install --system -r scripts/zarr/requirements.txt pyedflib \
            "jsonschema>=4.21" "pyarrow>=15.0" pytest

      # test_patch_duration.py wraps every case in
      # `unittest.skipUnless(HAVE_PYEDFLIB and HAVE_BIOSIGIO)`, and unittest exits
      # 0 whether the cases ran or all skipped. So if `uv pip install --system`
      # ever resolves to a different interpreter than the one below (uv/setup-python
      # skew, PATH ordering), the job goes green having asserted nothing. Fail here
      # instead, where the cause is obvious.
      - name: Verify the deps reached this interpreter
        run: |
          python -c 'import biosigio, pyedflib' || {
            echo '::error::biosigio/pyedflib not importable by this python;'\
                 'patch-duration-test would skip every assertion and still pass'
            exit 1
          }

      - name: Tier-2 duration tests
        run: python scripts/test_patch_duration.py

      # The converter suite with the dependencies actually installed, under
      # pytest so the skip COUNT is machine-readable (unittest's own runner
      # reports it only in prose).
      - name: Converter suite (full, real dependencies)
        run: |
          cd scripts/zarr
          pytest -q -rs --junit-xml=/tmp/zarr-tests.xml \
            test_generate_zarr.py test_zarr_queue.py \
            test_purge_non_raw_stores.py test_hallu_zarr_config.py \
            test_find_collapsed_channel_stores.py

      # A skip is invisible in a green job, and that is exactly how 43 tests
      # went unrun for the life of this epic. Only two KINDS of skip are
      # expected here, matched by their reason and not by how many there are:
      # the real-data download tests (`real-data test skipped: ...`, opted out
      # of or data.nemar.org unreachable -- TestSampleIndexAgainstARealRateChange
      # skips as a class, so one transient error is five skips, and a count
      # threshold tripped on run 36530497447) and the bash-3.2 guard-rail test
      # (`... is not bash 3.x ...`, this runner has bash 5). Any other skip is a
      # dependency that did not install or a test that quietly stopped running
      # -- the failure mode this step exists to make loud.
      - name: Fail on any unexpected skip
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("/tmp/zarr-tests.xml").getroot()
          expected, unexpected, tests = 0, [], 0
          for case in root.iter("testcase"):
              tests += 1
              skip = case.find("skipped")
              if skip is None:
                  continue
              reason = skip.get("message") or (skip.text or "")
              if reason.startswith("real-data test skipped") or "is not bash 3.x" in reason:
                  expected += 1
              else:
                  unexpected.append((f"{case.get('classname')}.{case.get('name')}", reason))
          print(f"{tests} tests, {expected + len(unexpected)} skipped "
                f"({expected} expected, {len(unexpected)} unexpected)")
          if unexpected:
              for name, reason in unexpected:
                  print(f"::error::unexpected skip: {name}: {reason}")
              print(
                  "::error::%d test(s) skipped for a reason other than the real-data "
                  "download or the bash-3.2 test. A dependency probably did not "
                  "install -- the suite passed without asserting." % len(unexpected)
              )
              sys.exit(1)
          PY

  # The scrub toolchain's suites, run against REAL git, git-annex, uv/python and the aws CLI
  # with a local S3 stand-in (no mocks, .rules/testing.md). They run only when the toolchain or
  # the scanner changes. NEMAR_REQUIRE_SCRUB_TOOLS makes a missing tool a failure: these suites
  # used to skip silently without uv or git-annex, and a skipped suite reports green.
  #
  # WHY THIS IS SHARDED. On one runner the suites took 25 to 46 minutes for a three-line change
  # (run 37586871174: 45 minutes), because they drive the real aws CLI hundreds of times and the
  # test files ran one after another. The files do not depend on each other (each starts its own
  # stand-in on an ephemeral port and registers its own temp directories), and a shard is its own
  # VM, so `bun test --shard=i/N` splits the files across N runners. The same tests run, against
  # the same real tools; only their grouping changed. The split is weighted by the per-file
  # durations in test/scrub/timings.json (`--timings`), because a few files take minutes and
  # most take seconds, so splitting by file count would leave one runner with all the slow ones.
  #
  # THE SLOWEST SLICE SETS THE TIME. bun cuts the path-sorted file list into contiguous slices
  # of about equal duration, so a shard cannot finish before its slowest file does, and the
  # cut points follow file order, not an ideal packing: five shards left one slice at 11.4
  # minutes, six at 11.7, seven at 8.9, measured on the timings when this was written. So
  # CHECK A SHARD COUNT BEFORE CHANGING IT, with a dry run that imports the files and runs no
  # test (it exits 1 on "matched 0 tests"; the junit file names each shard's files):
  #   for i in 1 2 3 4 5 6 7; do bun test --preload ./test/scrub/helpers/temp-dirs-preload.ts   #     --path-ignore-patterns='__run_every_scrub_suite__' --timings test/scrub/timings.json   #     --shard=$i/7 -t '^never$' --reporter=junit --reporter-outfile=/tmp/shard-$i.xml   #     test/scrub test/identifier-scan.test.ts test/identifier-scrub.test.ts   #     test/identifier-fleet.test.ts; done
  # delete.test.ts alone took 13.5 minutes, which no shard count beats, so its preconditions
  # describe block now lives in delete-preconditions.test.ts (the shared fixture is
  # delete-harness.ts). When a file grows past a third of the slice time again, split it the
  # same way before adding runners.
  #
  # THE CHECK NAME. `scrub-tools-shard` is the matrix; `scrub-tools` is a gate that needs it and
  # keeps the name this check always had, so anything that names it keeps working. The gate is
  # skipped exactly when the suites were not due (the same `if` as the shards, from the one
  # `scrub_suites` output), as the single job was. When they were due it fails unless every
  # shard succeeded AND the shards together ran every test file bun discovered, so a shard that
  # ran nothing, or a partition that dropped a file, cannot pass green.
  #
  # TO ADD A SHARD, add the next number to `matrix.shard`. The slice each job runs comes from
  # its position (`strategy.job-index`), so the numbers only count the jobs, and a gap or a
  # repeat is refused in the step below.
  #
  # TO REFRESH test/scrub/timings.json (after files are added, removed or split, or when the
  # shards drift apart): every shard uploads the durations it measured as the artifact
  # `scrub-shard-<n>`. From a green run on the branch:
  #   gh run download <run-id> --pattern 'scrub-shard-*' --dir /tmp/scrub-shards
  #   jq -S -s '{version: 1, files: (map(.files) | add)}' /tmp/scrub-shards/*/timings.json \
  #     > test/scrub/timings.json
  # A file missing from the timings file still runs; it is only balanced less well.
  scrub-tools-shard:
    name: scrub-tools shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A shard takes under 10 minutes. The limit is 30 because a cancelled check reads as neither
    # green nor red: the single 30 minute limit this job once had cancelled three runs that were
    # otherwise passing.
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.scrub_suites == 'true'
    strategy:
      # Every shard reports, so one red shard does not hide a second one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Tool versions
        run: |
          git --version
          git annex version | head -1
          uv --version
          aws --version

      # The lint job's filters do not match a scrub-only change, and `bun run lint` covers
      # src/ only, so the scrub tools are linted here, once (the first job), not once a shard.
      - name: Lint the scrub toolchain
        if: strategy.job-index == 0
        run: bun run lint:scrub

      # `bun run test:scrub`, not a bare `bun test`: bunfig.toml keeps test/scrub out of a bare run,
      # and the script's --path-ignore-patterns puts it back. It also owns the file list and the
      # temp-dir preload, so the shards cannot drift from a local run; --shard, --timings and
      # --update-timings are appended to it.
      #
      # An empty shard is not an error to bun: `--shard=3/3` over two files prints
      # "Ran 0 tests across 0 files" and exits 0. So the step reads the run's own summary and
      # refuses a shard that ran no file or no test, and records what it ran for the gate.
      - name: Scrub toolchain and scanner suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        shell: bash
        env:
          NEMAR_REQUIRE_SCRUB_TOOLS: "1"
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          SHARD_LABEL: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          shard=$((SHARD_INDEX + 1))
          if [ "$shard" != "$SHARD_LABEL" ]; then
            echo "::error::matrix.shard must be 1..N in order: job $SHARD_INDEX is labeled $SHARD_LABEL, so a slice of the suites would run twice or never"
            exit 1
          fi

          out="$RUNNER_TEMP/scrub-shard-out"
          mkdir -p "$out"
          timings="$out/timings.json"
          cp test/scrub/timings.json "$timings"
          log="$RUNNER_TEMP/scrub-shard.log"

          # pipefail keeps bun's own exit status: a failing test fails this step.
          bun run test:scrub --shard="$shard/$SHARD_TOTAL" --timings "$timings" --update-timings 2>&1 | tee "$log"

          esc=$(printf '\033')
          plain=$(sed -E "s/${esc}\[[0-9;]*m//g" "$log")
          header=$(grep -E -m1 '^--shard=[0-9]+/[0-9]+: running [0-9]+/[0-9]+ test files' <<<"$plain" || true)
          summary=$(grep -E '^Ran [0-9]+ tests? across [0-9]+ files?' <<<"$plain" | tail -1 || true)
          if [ -z "$header" ] || [ -z "$summary" ]; then
            echo "::error::bun printed no shard header or no run summary, so what this shard ran is unknown"
            exit 1
          fi
          read -r planned discovered < <(sed -E 's#^--shard=[0-9]+/[0-9]+: running ([0-9]+)/([0-9]+) test files.*#\1 \2#' <<<"$header")
          read -r tests files < <(sed -E 's#^Ran ([0-9]+) tests? across ([0-9]+) files?.*#\1 \2#' <<<"$summary")
          if [ "$files" -lt 1 ] || [ "$tests" -lt 1 ]; then
            echo "::error::shard $shard/$SHARD_TOTAL ran $tests tests across $files files; an empty shard passes bun and asserts nothing"
            exit 1
          fi
          if [ "$files" != "$planned" ]; then
            echo "::error::shard $shard/$SHARD_TOTAL was assigned $planned files and ran $files"
            exit 1
          fi

          jq -n --argjson shard "$shard" --argjson total "$SHARD_TOTAL" \
            --argjson files "$files" --argjson discovered "$discovered" --argjson tests "$tests" \
            '{shard: $shard, total: $total, files: $files, discovered: $discovered, tests: $tests}' \
            > "$out/shard.json"
          echo "shard $shard/$SHARD_TOTAL: $tests tests across $files of $discovered files" | tee -a "$GITHUB_STEP_SUMMARY"

      # The gate reads shard.json from every shard; timings.json is what a refresh of
      # test/scrub/timings.json collects (see the note above the job).
      - name: Upload what this shard ran and how long each file took
        uses: actions/upload-artifact@v4
        with:
          name: scrub-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/scrub-shard-out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # The check named `scrub-tools`. See THE CHECK NAME above.
  #
  # `if: always()` so a failed or cancelled shard still reaches this job and turns it red; a
  # job skipped because its dependency failed would read as passing. The second term skips it
  # when the suites were not due, which is what the single job did.
  scrub-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, scrub-tools-shard]
    if: always() && needs.changes.outputs.scrub_suites == 'true'
    steps:
      - name: Every shard must have succeeded
        env:
          SHARDS_RESULT: ${{ needs.scrub-tools-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::scrub-tools-shard finished as '$SHARDS_RESULT', not 'success'"
            exit 1
          fi

      - name: Download what every shard ran
        uses: actions/download-artifact@v4
        with:
          pattern: scrub-shard-*
          path: scrub-shards

      # A green shard is not enough: bun can run a shard that holds no file, and a partition
      # that disagreed between shards (a different bun on one runner) could drop or repeat a
      # file. Each shard recorded how many files it ran and how many bun discovered in all.
      - name: The shards together ran every test file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(scrub-shards/*/shard.json)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::no shard left a report"
            exit 1
          fi
          problems=$(jq -r -s '
            . as $all
            | ($all[0].total) as $total
            | ($all[0].discovered) as $discovered
            | [
                (if ($all | length) != $total
                  then "expected \($total) shard reports, found \($all | length)" else empty end),
                (if ([$all[].total] | unique | length) != 1
                  then "the shards disagree on how many shards there are" else empty end),
                (if ([$all[].discovered] | unique | length) != 1
                  then "the shards disagree on how many test files exist" else empty end),
                (if ([$all[].shard] | sort) != [range(1; $total + 1)]
                  then "the shard numbers are not exactly 1..\($total)" else empty end),
                (if ([$all[].files] | add) != $discovered
                  then "the shards ran \([$all[].files] | add) test files and bun discovered \($discovered)" else empty end),
                ($all[] | select(.files < 1 or .tests < 1)
                  | "shard \(.shard) ran \(.tests) tests across \(.files) files")
              ] | .[]' "${reports[@]}")
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<<"$problems"
            exit 1
          fi
          jq -r -s '
            "| shard | files | tests |\n|---|---|---|\n"
            + ([.[] | "| \(.shard)/\(.total) | \(.files) | \(.tests) |"] | join("\n"))
            + "\n| all | \([.[].files] | add) of \(.[0].discovered) | \([.[].tests] | add) |"
          ' "${reports[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Type check and lint - always runs on code changes
  lint:
    runs-on: ubuntu-latest
    needs: changes
    # Matches unit-pure's trigger so that, as a required check, lint never
    # "skips" on a backend-only PR (a skipped required check blocks merges).
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.zarr == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.decisions == 'true' || needs.changes.outputs.agentdocs == 'true' || needs.changes.outputs.neurobagel_deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

      # `test/` and `backend/test/` are NOT type-checked -- `tsconfig.json` includes
      # only `src` and `shared`, and widening it is a real project rather than a flag:
      # 82 root test files import backend sources, so the test tier needs BOTH
      # `bun-types` and `@cloudflare/workers-types`, and those two disagree about
      # globals like `Request`, `fetch` and `caches` (582 errors when combined).
      #
      # This is the cheap half of that, and it is the half that actually bit: five live
      # suites once died at module scope with `ReferenceError: LIVE_TARGET_BLOCKED is
      # not defined`, because a script's "already imported?" check was satisfied by a
      # comment it had just inserted. Biome needs no type information to see an
      # identifier that is never declared, and it names the file and the line.
      #
      # `--only` rather than a full `biome check` on the test dirs: those carry
      # pre-existing style findings (non-null assertions, `delete`, string concat) that
      # would fail the job for reasons unrelated to this guard, and fixing them is a
      # separate change from installing the guard.
      - name: Lint tests for undeclared identifiers
        run: bunx biome lint --only=correctness/noUndeclaredVariables test/ backend/test/

  # Unit tests - runs on CLI or test changes
  # Tier 1 (REQUIRED on dev + main): pure, deterministic tests with no network.
  # Auto-classified as every non-e2e file that does NOT hit the live backend
  # (no testRequest / TEST_API_URL / runCli) -- new tests route themselves, no
  # renames. Fast (~1 min) and never flaky, so this is the gate for landing
  # into dev. See https://docs.nemar.org/admin/operations/access-policies/ for the tiering rationale.
  unit-pure:
    runs-on: ubuntu-latest
    needs: changes
    # `decisions` is here, not only on `lint`: test/adr-index.unit.test.ts is the
    # thing that checks an ADR against the index, and `unit-pure` is the only job
    # that runs test/*.test.ts at all -- `lint` runs tsc and biome. Adding the
    # filter to `lint` alone left the index test still skipped on an ADR-only PR,
    # which is the gap it was added to close.
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.zarr == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.decisions == 'true' || needs.changes.outputs.agentdocs == 'true' || needs.changes.outputs.neurobagel_deploy == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Install backend dependencies
        run: cd backend && bun install

      # The website's transcription of shared/contract/account-copy.ts, so
      # test/account-copy-parity.test.ts can actually compare the two here
      # (#1268, ADR 0045). Without it that test found no checkout and returned
      # early: the parity claim was enforced on developer machines and nowhere
      # else, while reporting green as a required check.
      #
      # nemarOrg/website is PUBLIC, so no token is needed. Sparse, non-cone, one
      # file: a table of string constants, not that repo's module graph. It
      # lands in website-copy/ at the repo root, which the unit-pure file glob
      # below cannot reach (it lists test/*.test.ts and backend/test/*.test.ts
      # only) and .gitignore covers.
      #
      # REF PAIRING: always website `staging`, never `main`, whatever this PR
      # targets. The pre-release branches are the coupled pair — website
      # `staging` and nemar-cli `dev` carry a copy change together — and `main`
      # on either side is only a snapshot of them taken at the last release.
      #
      # Pinning `main` for a main-targeted PR, as this step did until #1278,
      # DEADLOCKS every coordinated release that touches the copy, and does so
      # symmetrically: this repo's release PR compares dev-side copy against the
      # website's not-yet-promoted `main`, while the website's release PR
      # compares its staging copy against OUR not-yet-promoted `main`. Both go
      # red, and neither can merge to give the other what it wants. Observed on
      # the v0.9.16 / website v0.2.8 release of epic #1250, the first release
      # after the gate landed (nemar-cli #1276, website #314).
      #
      # Comparing against `staging` keeps the gate non-vacuous: every copy
      # change lands on `dev` or `staging` through a PR, and that PR is checked
      # against the counterpart's live pre-release branch. A promotion PR
      # re-checks the exact pair that is about to ship together, which is the
      # question worth asking at release time. `main` vs `main` adds nothing
      # once both have promoted, since each then equals its pre-release branch.
      #
      # See ADR 0046.
      - name: Check out the website's copy table
        uses: actions/checkout@v4
        with:
          repository: nemarOrg/website
          path: website-copy
          sparse-checkout: src/lib/account-copy.ts
          sparse-checkout-cone-mode: false
          ref: staging

      # The deployed copy of onboard-openneuro.yml, for the same reason and with the
      # same shape (#1309). That workflow is authored in this repo beside the CLI it
      # invokes, then deployed by copying it whole into nemarDatasets/.github -- and
      # the two had already drifted by one merged PR before anyone noticed, because
      # nothing compared them. `main`, not a pre-release branch: that repo has no
      # release train, so what is on main is what runs.
      #
      # nemarDatasets/.github is PUBLIC, so no token is needed. Sparse, non-cone, one
      # file. It lands in dataset-workflows-live/ at the repo root, which the
      # unit-pure file glob does not reach, so it cannot be mistaken for a test file.
      - name: Check out the deployed dataset workflow
        uses: actions/checkout@v4
        with:
          repository: nemarDatasets/.github
          path: dataset-workflows-live
          sparse-checkout: .github/workflows/onboard-openneuro.yml
          sparse-checkout-cone-mode: false
          ref: main

      # The docs content tree, so test/docs-links.unit.test.ts can check that
      # every docs.nemar.org pointer in AGENTS.md and .rules/ resolves to a page
      # that exists (epic #1336 phase 1, ADR 0057). Same reasoning as the two
      # checkouts above: without it the test finds no checkout and skips, which
      # would enforce the claim on developer machines and nowhere else.
      #
      # A DIRECTORY rather than one file, because resolution needs every page to
      # build the slug map. Still sparse and still shallow: the test reads the
      # object store with `git ls-tree` and `git grep` against the `main` ref
      # rather than the working tree, so branch state cannot skew the answer.
      # `actions/checkout` with `ref: main` creates that local branch, which is
      # what the test resolves.
      #
      # `main`, not a pre-release branch: that repo has no release train, and
      # merging to main IS its deploy, so what is on main is what is served.
      #
      # THE TOKEN FALLBACK IS WHAT SURVIVES nemarOrg/docs GOING PRIVATE.
      # `github.token` can read a public repo, so this works today unchanged. It
      # cannot read a private one, and the test treats a declared-but-missing
      # checkout as a FAILURE rather than a skip -- deliberately, so a broken
      # checkout cannot quietly disable the check. So the day that repo is made
      # private, this job goes red unless `DOCS_READ_TOKEN` exists.
      #
      # Setting the secret first, and leaving this fallback in place, means the
      # visibility change needs no coordinated workflow edit and has no window
      # where CI is red. The secret wants read access to that repo's contents and
      # nothing else.
      # SKIPPED ON A FORK, and that is not a nicety. `nemarOrg/docs` is private,
      # a fork pull request receives NO secrets, and `github.token` on a fork is
      # scoped to the fork, so this step cannot succeed there. Without this
      # condition an outside contributor fixing an unrelated typo gets a red
      # REQUIRED check, failing on a repository they have nothing to do with and
      # cannot be given access to. That is precisely the outcome ADR 0057 says
      # must not happen: losing read access must not cost someone the ability to
      # contribute. Found reviewing the epic that made the docs repo private.
      - name: Check out the docs content tree
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: nemarOrg/docs
          path: docs-live
          sparse-checkout: src/content/docs
          sparse-checkout-cone-mode: false
          ref: main
          token: ${{ secrets.DOCS_READ_TOKEN || github.token }}

      - name: Run pure unit tests (no live backend)
        env:
          # Names the checkout above. The parity test treats this as the
          # contract: a path that is not there FAILS rather than skipping, so a
          # broken checkout step cannot silently disable the check.
          NEMAR_WEBSITE_ACCOUNT_COPY: website-copy/src/lib/account-copy.ts
          NEMAR_DATASET_WORKFLOW_LIVE: dataset-workflows-live/.github/workflows/onboard-openneuro.yml
          # Empty on a fork, where the checkout above is skipped, so the guard
          # skips VISIBLY instead of failing on a checkout that could never have
          # worked. On any run from this repository it is set, and a missing
          # path there is still a hard failure -- which is the property that
          # stops a broken checkout step from silently disabling the guard.
          NEMAR_DOCS_CHECKOUT: ${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push') && 'docs-live' || '' }}
        run: |
          # Deliberately no TEST_API_URL / secrets: these tests don't touch the
          # backend, so a misclassified file fails loudly here instead of
          # silently flaking in the wrong tier.
          shopt -s nullglob
          files=()
          for f in test/*.test.ts backend/test/*.test.ts backend/test/helpers/*.test.ts; do
            base="$(basename "$f")"
            case "$base" in
              e2e-sandbox.test.ts|e2e-upload.test.ts|zenodo-sandbox.test.ts|ezid.test.ts|ezid-sandbox.test.ts|auth-passwordless.test.ts) continue;;
              # *.integration.test.ts hit external networks (e.g. live DataCite/
              # Crossref) and are non-deterministic; they must NOT gate the pure
              # (required, offline) tier or, via test-gate, the prod deploy.
              *.integration.test.ts) continue;;
            esac
            if grep -Eq 'testRequest|TEST_API_URL|runCli\(' "$f"; then continue; fi
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No pure test files matched" >&2; exit 1; fi
          echo "Running ${#files[@]} pure test files"
          bun test "${files[@]}"

  # Tier 2 (SOFT on dev, REQUIRED on main): integration tests that hit the LIVE
  # dev backend (real AWS STS / D1 / network). These flake transiently (a
  # different ~2 of ~1600 each run), so --retry=2 rides over infra hiccups while
  # a genuinely broken test still fails all 3 attempts. NOT a required check on
  # dev (a transient flake must not block a PR); the dev->main gate makes it
  # required, and nightly-tests.yml provides scheduled hard coverage + issue.
  integration-dev:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    env:
      TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
      TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
      TEST_OWNER_API_KEY: ${{ secrets.TEST_OWNER_API_KEY }}
      TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
      TEST_BYPASS_TOKEN: ${{ secrets.TEST_BYPASS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Install backend dependencies
        run: cd backend && bun install

      - name: Run live-backend integration tests (--retry for transient flakes)
        run: |
          # Every non-e2e file that DOES hit the live dev backend, including
          # cli.test.ts (runCli spawns the binary against the backend).
          shopt -s nullglob
          files=()
          for f in test/*.test.ts backend/test/*.test.ts backend/test/helpers/*.test.ts; do
            base="$(basename "$f")"
            case "$base" in
              e2e-sandbox.test.ts|e2e-upload.test.ts|zenodo-sandbox.test.ts|ezid.test.ts|ezid-sandbox.test.ts|auth-passwordless.test.ts) continue;;
              # *.integration.test.ts (external-network tests) run here, where
              # --retry=2 --timeout 30000 lets a transient API hiccup retry
              # instead of turning a required check red.
              *.integration.test.ts) files+=("$f"); continue;;
            esac
            if grep -Eq 'testRequest|TEST_API_URL|runCli\(' "$f"; then files+=("$f"); fi
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No integration test files matched" >&2; exit 1; fi
          echo "Running ${#files[@]} integration test files"
          # --timeout 30000 (vs 5000ms default): these hit the live dev backend
          # and spawn the CLI via `bun run src/index.ts`; cold D1 reads and the
          # per-invocation transpile can momentarily exceed 5s, surfacing as
          # 5000ms timeouts / exit-143 SIGTERMs rather than real failures (#672).
          bun test --retry=2 --timeout 30000 "${files[@]}"

  # Python script tests for scripts/emit_manifest.py + helpers ran here
  # under #557 (the central manifest workflow). Those scripts now live in
  # nemarDatasets/.github (#564) where the workflow itself runs; the
  # python-unit-test job moved there as
  # nemarDatasets/.github/.github/workflows/test-emit-manifest.yml.

  # API integration tests - uses dev environment (no rate limiting)
  api-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run API tests against dev environment
        env:
          # Use dev API - no rate limiting
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
        # --timeout 20000 (vs 5000ms default): api.test.ts hits the live dev
        # backend; a cold D1 read replica occasionally pushes a request past 5s
        # (e.g. the DOI-info / doi/concept tests, #672). The endpoints are fast
        # in isolation, so 20s asserts correctness without cold-start flake.
        run: bun test --timeout 20000 test/api.test.ts

  # E2E Sandbox tests - installs CLI from npm and runs against sandbox
  # Runs on PRs to dev (basic) and main (comprehensive)
  e2e-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Determine npm tag and wait for publish
        id: npm-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "Looking for PR${PR_NUMBER} package with commit ${SHORT_SHA}..."

          # Wait for npm-publish workflow to complete with matching version
          for i in {1..30}; do
            VERSION=$(timeout 10 npm view nemar-cli@PR${PR_NUMBER} version 2>/dev/null || echo "")
            if [[ "$VERSION" == *"$SHORT_SHA"* ]]; then
              echo "Found matching version: $VERSION"
              echo "tag=PR${PR_NUMBER}" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i: version=$VERSION (waiting for $SHORT_SHA)..."
            sleep 10
          done

          # Fallback to dev if PR version not found after 5 minutes
          echo "::warning::PR-specific package PR${PR_NUMBER} with commit ${SHORT_SHA} not found after 5 minutes. Falling back to 'dev' tag. E2E tests may not be testing actual PR changes!"
          echo "tag=dev" >> $GITHUB_OUTPUT

      - name: Install CLI from npm
        run: |
          bun install -g nemar-cli@${{ steps.npm-tag.outputs.tag }}
          echo "Installed version: $(nemar --version)"

      - name: Install test dependencies
        run: bun install

      - name: Run E2E sandbox tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: bun test test/e2e-sandbox.test.ts

  # E2E upload tests - full upload workflow. Runs on push to main (the
  # release itself) AND on a pull request targeting main (the release PR),
  # so a dead GH_TOKEN or a broken upload path is caught before the merge
  # that deploys it, not only after (issue #1321). `pull_request` events
  # targeting `main` already trigger this workflow (see the `on:` block
  # above); a same-repo PR still gets secrets, but a fork PR does not, which
  # is why the `pull_request` branch below also checks `head.repo.full_name`
  # (same guard the "Check out the docs content tree" step above uses): a
  # fork PR targeting main would otherwise run this job, fail on the missing
  # GH_TOKEN, and turn an outside contributor's unrelated PR red for a
  # reason they cannot fix. Skipping is the correct outcome there.
  e2e-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: |
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      ) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.cli == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install DataLad and git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
          pip install datalad

      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install dependencies
        run: bun install

      # Fails loudly, in its own labeled step, when GH_TOKEN is dead (#1321:
      # every release since v0.10.0 has hit this as two cryptic
      # "Bad credentials (HTTP 401)" test failures instead). GH_TOKEN has to
      # stay a nemarAdmin user PAT, not a GitHub App token: the upload flow
      # accepts collaborator invitations, pushes, and opens PRs as the user,
      # and `gh api user` (what this probes) 403s for an installation token.
      - name: Probe GH_TOKEN before running upload tests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bun run scripts/ci/probe-github-token.ts GH_TOKEN \
            --owner nemarAdmin \
            --require-scopes repo,workflow \
            --issue 1321

      - name: Run E2E upload tests against dev environment
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bun test test/e2e-upload.test.ts

  # Zenodo sandbox tests - verifies DOI creation workflows
  zenodo-sandbox-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run Zenodo sandbox tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          RUN_ZENODO_TESTS: "true"
          TEST_DATASET_ID: "nm099999"
          ZENODO_SANDBOX_API_KEY: ${{ secrets.ZENODO_SANDBOX_API_KEY }}
        run: bun test test/zenodo-sandbox.test.ts

  # Passwordless email-code auth tests - only on PRs/pushes to main.
  # Each run triggers real Resend API calls (even to .test addresses),
  # so running on every dev PR exhausts the daily email quota quickly.
  #
  # Path-gated on the `email` filter so PRs that don't touch the
  # passwordless or email surface (the vast majority of nemar-cli
  # changes) skip the suite entirely. Without the filter, a backend
  # change in any unrelated file would re-trigger this job on the dev
  # branch and burn the daily Resend quota even though no email code
  # was touched. The main-branch / PR-base-main gate stays in place as
  # a second backstop.
  passwordless-auth-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.email == 'true' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run passwordless auth tests
        env:
          TEST_API_URL: https://nemar-api-dev.sccn-org.workers.dev
          TEST_BYPASS_TOKEN: ${{ secrets.TEST_BYPASS_TOKEN }}
          # Required by the #595 / #572 cases: `seedWebUser` and the
          # no-row-created admin /users lookup both authenticate as
          # admin via TEST_ADMIN_API_KEY. Without it the helper 401s
          # before the test body runs.
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
        run: bun test test/auth-passwordless.test.ts
