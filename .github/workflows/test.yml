name: Tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

# Permissions needed for dorny/paths-filter to access PR files
permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check what files changed to determine which tests to run
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      backend: ${{ steps.filter.outputs.backend }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
            backend:
              - 'backend/**'
            tests:
              - 'test/**'

  # Type check and lint - always runs on code changes
  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

  # Unit tests - runs on CLI or test changes
  unit-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run CLI unit tests
        env:
          # Use dev API - no rate limiting
          TEST_API_URL: https://nemar-api-dev.shirazi-10f.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
        run: bun test test/cli.test.ts

  # API integration tests - uses dev environment (no rate limiting)
  api-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Run API tests against dev environment
        env:
          # Use dev API - no rate limiting
          TEST_API_URL: https://nemar-api-dev.shirazi-10f.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
        run: bun test test/api.test.ts

  # E2E tests - only on main push, uses dev environment
  e2e-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.cli == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install DataLad and git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
          pip install datalad

      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install dependencies
        run: bun install

      - name: Run E2E tests against dev environment
        env:
          # Use dev API - no rate limiting
          TEST_API_URL: https://nemar-api-dev.shirazi-10f.workers.dev
          TEST_ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
          TEST_USER_API_KEY: ${{ secrets.TEST_USER_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bun test test/e2e-upload.test.ts
