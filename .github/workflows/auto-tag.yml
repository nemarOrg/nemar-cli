name: Auto Tag and Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.AUTO_TAG_PAT }}

      - name: Check for version change
        id: version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Get previous version from the commit before
          if git show HEAD^:package.json > /tmp/old-package.json 2>&1; then
            echo "Found previous package.json"
          else
            echo "::notice::Could not fetch previous package.json (first commit or shallow clone). Using fallback version 0.0.0"
            echo '{"version":"0.0.0"}' > /tmp/old-package.json
          fi
          PREVIOUS_VERSION=$(jq -r '.version' /tmp/old-package.json)
          echo "previous=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

          # Check if version changed
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged at $CURRENT_VERSION"
          fi

          # Check if this is a pre-release version (contains -)
          if [[ "$CURRENT_VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG_NAME="v${{ steps.version.outputs.current }}"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG_NAME already exists - skipping creation. This may indicate manual tag creation or workflow re-run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created and pushed tag $TAG_NAME"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_TAG_PAT }}
        run: |
          TAG_NAME="v${{ steps.version.outputs.current }}"
          PREV_TAG="v${{ steps.version.outputs.previous }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"

          # Build release notes from commits since previous version
          RELEASE_ARGS=(
            "$TAG_NAME"
            --title "$TAG_NAME"
            --generate-notes
          )

          # If previous tag exists, use it as the baseline for notes
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "${RELEASE_ARGS[@]}"
          echo "Created GitHub Release $TAG_NAME"
