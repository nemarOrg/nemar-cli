name: Bump BIDS Validator Pin

# Weekly check for new 2.x releases of @bids/validator on JSR.
# Opens a PR when a newer stable version is available so the CLI and the
# per-dataset CI workflow template don't drift from the latest patch.
# See issue #586 for background.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve latest @bids/validator 2.x
        id: resolve
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://jsr.io/@bids/validator/meta.json)
          LATEST=$(echo "$META" | jq -r '
            .versions
            | keys[]
            | select(test("^2\\.[0-9]+\\.[0-9]+$"))
          ' | sort -V | tail -n1)
          CURRENT=$(jq -r '.version' validator-version.json)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pin already at $CURRENT — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Update pin
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          jq --arg v "${{ steps.resolve.outputs.latest }}" '.version = $v' \
            validator-version.json > validator-version.json.tmp
          mv validator-version.json.tmp validator-version.json

      - name: Install deps
        if: steps.resolve.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Run tests against new pin
        if: steps.resolve.outputs.skip == 'false'
        run: bun test

      - name: Open PR
        if: steps.resolve.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-bids-validator-${{ steps.resolve.outputs.latest }}
          base: dev
          commit-message: "chore: bump @bids/validator to ${{ steps.resolve.outputs.latest }}"
          title: "chore: bump @bids/validator ${{ steps.resolve.outputs.current }} -> ${{ steps.resolve.outputs.latest }}"
          body: |
            Auto-generated by `bump-validator.yml`.

            Bumps the pinned BIDS validator from `${{ steps.resolve.outputs.current }}`
            to `${{ steps.resolve.outputs.latest }}` (latest stable 2.x on JSR).

            This keeps `nemar dataset validate` (local) and the per-dataset
            `bids-validation` CI workflow in lockstep — see issue #586 for the
            drift bug this prevents.

            Test suite passed against the new pin before this PR was opened.
          labels: |
            dependencies
            automated
          delete-branch: true
