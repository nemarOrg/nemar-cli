name: Auto Bump Dev

# Increments the `-devN` suffix on `dev` after every push that adds real
# code, so every commit on the dev branch carries a fresh pre-release
# version. The clean version + tag is still owned by auto-tag.yml when dev
# eventually merges into main.
#
# Skip conditions:
#   - HEAD commit was authored by nemar-bot (prevents loop on our own
#     bump-and-push).
#   - HEAD commit message starts with "chore: bump version to" (catches
#     manual bumps and the sync-dev.yml bump).
#   - HEAD commit message contains "[skip-bump]" (escape hatch).
#
# The flow:
#   - Read current version from package.json.
#   - If no `-devN` suffix, log and exit (dev should always carry one;
#     missing means a release just merged and sync-dev hasn't fired yet,
#     or someone is mid-release).
#   - Otherwise bump to `-dev(N+1)` via scripts/bump-version.sh.
#   - Push as nemar-bot. The commit message starts with the standard
#     "chore: bump version to ..." prefix so this workflow self-filters
#     on the next push event.
#
# THIS WORKFLOW ALSO OWNS THE DEV DEPLOY. The `dispatch` job runs after `bump`
# and dispatches deploy-backend.yml once, for the commit dev ends at: the bump
# when there is one, else the pushed commit when it touched backend/**,
# shared/** or deploy-backend.yml (the paths that used to trigger a dev deploy
# directly). The bump's own push dispatches nothing: the run that made it has.
# So one merge is one dev deploy, at the bumped version, where it used to be a
# deploy of the merge commit and a second one of the bump (see the note in
# deploy-backend.yml). Deciding here, after the bump, is what makes that
# possible: when the merge commit's push arrives nothing yet knows whether a
# bump will follow.
#
# The bump commit keeps no skip-ci marker on purpose. It is always the head of
# dev, so it is the head of every release pull request (dev -> main), and a
# marker there would stop that pull request's required checks from ever
# running. Its push instead starts only cheap jobs: Tests and this workflow
# recognize it (scripts/ci/classify-push.sh) and skip their work.

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  bump:
    # Filter out the bot's own commits and explicit opt-outs at the job
    # level so we never even spin up a runner for those events.
    if: |
      github.event.head_commit.author.email != 'nemar-bot@users.noreply.github.com'
      && !startsWith(github.event.head_commit.message, 'chore: bump version to')
      && !contains(github.event.head_commit.message, '[skip-bump]')
    runs-on: ubuntu-latest
    # p95 16 s (50 green runs to 2026-10-13); 10 is the floor.
    timeout-minutes: 10
    outputs:
      # The bump commit this run pushed; empty when it pushed none.
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
          # AUTO_TAG_PAT is required to push the bump commit back to dev
          # without tripping branch protection rules that block the
          # default GITHUB_TOKEN from writing.
          token: ${{ secrets.AUTO_TAG_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        # bump-version.sh runs `bun run build` to verify the bump took.
        run: bun install

      - name: Compute next dev suffix
        id: compute
        run: |
          CURRENT=$(jq -r '.version' package.json)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Expect a -devN suffix. Anything else is unexpected on dev;
          # we log and exit success without bumping rather than guessing.
          if [[ ! "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-dev([0-9]+)$ ]]; then
            echo "No -devN suffix on $CURRENT — leaving dev branch as-is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${BASH_REMATCH[1]}"
          N="${BASH_REMATCH[2]}"
          NEXT=$((N + 1))
          echo "next=$BASE-dev$NEXT" >> "$GITHUB_OUTPUT"
          echo "arg=dev$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Will bump $CURRENT -> $BASE-dev$NEXT"

      - name: Configure git identity
        if: steps.compute.outputs.skip == 'false'
        run: |
          git config user.name "nemar-bot"
          git config user.email "nemar-bot@users.noreply.github.com"

      - name: Run bump script
        if: steps.compute.outputs.skip == 'false'
        env:
          # bump-version.sh -> git commit triggers husky pre-commit which
          # runs root + backend typecheck. Backend deps are not installed
          # here and the bump is mechanical, so disable husky. Matches the
          # existing pattern in sync-dev.yml and auto-tag.yml (see #454).
          HUSKY: '0'
        run: ./scripts/bump-version.sh "${{ steps.compute.outputs.arg }}"

      - name: Push bump commit
        id: push
        if: steps.compute.outputs.skip == 'false'
        run: |
          # bump-version.sh has already created the commit; push it.
          # If a parallel push raced us, abort: the next push will
          # trigger this workflow again from the new HEAD. With no
          # `sha` output, `dispatch` deploys the pushed commit instead.
          if git push origin dev; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::push to dev rejected (likely a concurrent push); skipping"
          fi

  # The one dev deploy for this push (see the note at the top). Runs whatever
  # `bump` did: skipped (a bot or bump commit, [skip-bump]), no bump (no -devN
  # suffix, push rejected) or failed; only a cancelled run deploys nothing.
  dispatch:
    needs: bump
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # New job: a checkout, the classifier and an API call; 10 is the floor.
    timeout-minutes: 10
    permissions:
      actions: write # gh workflow run
      contents: read
    steps:
      - name: Checkout code
        if: needs.bump.outputs.sha == ''
        uses: actions/checkout@v4

      - name: Classify the push
        id: push
        if: needs.bump.outputs.sha == ''
        run: scripts/ci/classify-push.sh >> "$GITHUB_OUTPUT"

      - name: Decide what to deploy
        id: plan
        env:
          BUMP_SHA: ${{ needs.bump.outputs.sha }}
          AUTO_BUMP: ${{ steps.push.outputs.auto_bump }}
          DEPLOY_PATHS: ${{ steps.push.outputs.deploy_paths }}
        run: |
          if [ -n "$BUMP_SHA" ]; then
            # The bump touches backend/package.json, so a bumped merge always
            # redeployed dev; it still does, once, at the bump.
            echo "deploy_sha=$BUMP_SHA" >> "$GITHUB_OUTPUT"
            echo "dev deploy: the bump $BUMP_SHA"
          elif [ "$AUTO_BUMP" = "true" ]; then
            # This push IS a bump this workflow made; the run that made it
            # dispatched its deploy.
            echo "dev deploy: none, the run that pushed this bump dispatched it"
          elif [ "$DEPLOY_PATHS" = "true" ]; then
            echo "deploy_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "dev deploy: the pushed commit $GITHUB_SHA (no bump)"
          else
            echo "dev deploy: none, the push touched no backend path"
          fi

      - name: Dispatch the dev deploy
        if: steps.plan.outputs.deploy_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.plan.outputs.deploy_sha }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run deploy-backend.yml --ref dev -f sha="$SHA"; then
              echo "::notice::dispatched the dev deploy of $SHA"
              exit 0
            fi
            echo "::warning::dispatch attempt $attempt failed"
            sleep 10
          done
          echo "::error::could not dispatch the dev deploy of $SHA; run: gh workflow run deploy-backend.yml --ref dev -f sha=$SHA"
          exit 1
