name: Auto Bump Dev

# Increments the `-devN` suffix on `dev` after every push that adds real
# code, so every commit on the dev branch carries a fresh pre-release
# version. The bump is FOLDED into the merged commit (via amend + force-push)
# rather than added as a standalone "chore: bump" commit, so a regular
# dev -> main merge doesn't drag a trail of bump commits into main's history.
# The clean version + tag is still owned by auto-tag.yml when dev eventually
# merges into main.
#
# Skip conditions:
#   - HEAD commit was COMMITTED by nemar-bot — the amended/force-pushed result
#     of this job carries nemar-bot as committer (author stays the PR author),
#     which is how we avoid re-bumping our own force-push.
#   - HEAD commit was authored by nemar-bot (legacy standalone-bump path).
#   - HEAD commit message starts with "chore: bump version to" (catches
#     manual bumps and the sync-dev.yml bump).
#   - HEAD commit message contains "[skip-bump]" (escape hatch).
#
# The flow:
#   - Read current version from package.json.
#   - If no `-devN` suffix, log and exit (dev should always carry one;
#     missing means a release just merged and sync-dev hasn't fired yet,
#     or someone is mid-release).
#   - Otherwise bump to `-dev(N+1)` via scripts/bump-version.sh, then fold that
#     bump into the merged commit (reset --soft + commit --amend) and
#     force-push (with-lease) as nemar-bot, so no standalone bump commit lands.

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  bump:
    # Filter out the bot's own commits and explicit opt-outs at the job
    # level so we never even spin up a runner for those events. The
    # committer-email check is what breaks the loop after this job amends the
    # merged commit and force-pushes: that force-push re-fires the push event,
    # but the amended commit's committer is nemar-bot (author stays the original
    # PR author), so we skip it. The author + message checks stay for the legacy
    # standalone-bump path and manual/[skip-bump] cases.
    if: |
      github.event.head_commit.author.email != 'nemar-bot@users.noreply.github.com'
      && github.event.head_commit.committer.email != 'nemar-bot@users.noreply.github.com'
      && !startsWith(github.event.head_commit.message, 'chore: bump version to')
      && !contains(github.event.head_commit.message, '[skip-bump]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
          # AUTO_TAG_PAT is required to push the bump commit back to dev
          # without tripping branch protection rules that block the
          # default GITHUB_TOKEN from writing.
          token: ${{ secrets.AUTO_TAG_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # bump-version.sh runs `bun run build` to verify the bump took.
        run: bun install

      - name: Compute next dev suffix
        id: compute
        run: |
          CURRENT=$(jq -r '.version' package.json)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Expect a -devN suffix. Anything else is unexpected on dev;
          # we log and exit success without bumping rather than guessing.
          if [[ ! "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-dev([0-9]+)$ ]]; then
            echo "No -devN suffix on $CURRENT — leaving dev branch as-is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${BASH_REMATCH[1]}"
          N="${BASH_REMATCH[2]}"
          NEXT=$((N + 1))
          echo "next=$BASE-dev$NEXT" >> "$GITHUB_OUTPUT"
          echo "arg=dev$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Will bump $CURRENT -> $BASE-dev$NEXT"

      - name: Configure git identity
        if: steps.compute.outputs.skip == 'false'
        run: |
          git config user.name "nemar-bot"
          git config user.email "nemar-bot@users.noreply.github.com"

      - name: Bump version and fold it into the merged commit
        if: steps.compute.outputs.skip == 'false'
        env:
          # bump-version.sh -> git commit triggers husky pre-commit which
          # runs root + backend typecheck. Backend deps are not installed
          # here and the bump is mechanical, so disable husky. Matches the
          # existing pattern in sync-dev.yml and auto-tag.yml (see #454).
          HUSKY: '0'
        run: |
          # bump-version.sh edits package.json (+ backend/package.json lockstep),
          # rebuilds to verify, and commits a standalone "chore: bump" commit.
          # We then FOLD that commit into the just-merged feature commit so the
          # version bump rides on it instead of adding a standalone history
          # entry (keeps dev -> main history clean; dev -> main is a regular
          # merge). `git reset --soft HEAD~1` drops the bump commit but keeps its
          # staged package.json changes; `git commit --amend` merges them into
          # the feature commit (author preserved; committer becomes nemar-bot,
          # which is what the job-level committer filter keys off to avoid
          # re-bumping the force-pushed result).
          BEFORE=$(git rev-parse HEAD)
          ./scripts/bump-version.sh "${{ steps.compute.outputs.arg }}"
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::warning::bump-version.sh made no commit (version unchanged); nothing to fold"
            exit 0
          fi
          git reset --soft HEAD~1
          git commit --amend --no-edit
          # --force-with-lease=dev:$BEFORE: only replace dev if it is STILL the
          # exact commit we checked out ($BEFORE = the merged feature commit).
          # The explicit expected-OID form doesn't depend on a remote-tracking
          # ref (the checkout is shallow). If a concurrent merge moved dev, the
          # lease fails and we skip rather than clobber — the next push
          # re-triggers from the new HEAD. Requires allow_force_pushes on dev
          # (the bot pushes with AUTO_TAG_PAT).
          git push --force-with-lease=dev:"$BEFORE" origin dev || {
            echo "::warning::force-push to dev rejected (concurrent push, or force-push disabled on dev); skipping"
            exit 0
          }
