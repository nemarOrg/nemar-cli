name: Check summary.json drift

# Weekly verification that every published dataset version has summary.json
# at the current target schema (the runtime value is read from the
# /admin/summary/coverage response — don't hardcode the version here, the
# constant lives in backend/src/services/manifest-coverage.ts TARGET_SCHEMA).
# Opens an issue when drift is detected
# so a human can decide whether to backfill via
# `nemar admin summary check --fix`.
#
# Epic #618 / phase 2 (#620).

on:
  schedule:
    # Mondays 09:00 UTC. Picks a time that's after the weekend's hallu sync
    # but before the start of the US workday so drift surfaces early.
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  PROD_API_URL: https://nemar-api.sccn-org.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      # THIS JOB HAS NO CHECKOUT STEP, deliberately: it needs no source tree. But
      # `gh` finds its repository by asking git for the remote, and with no
      # checkout there is no git repository, so every `gh issue` and `gh label`
      # call died with "failed to run git: fatal: not a git repository". Of the 20
      # scheduled runs on record (the first on 2026-06-01), 19 failed that way in
      # "Open / update drift issue", so the drift issue this workflow exists to
      # file was never opened. The other one (2026-08-24) failed in "Open / update
      # report-broken issue" for the same reason, while reporting that the
      # coverage endpoint had answered HTTP 500, so that outage went unreported.
      #
      # Job-level so a step added later inherits it instead of repeating the bug.
      # test/workflow-gh-calls.test.ts fails on a `gh` call that has no checkout, no
      # GH_REPO and no --repo.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch coverage report
        id: fetch
        env:
          ADMIN_API_KEY: ${{ secrets.PROD_ADMIN_API_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/coverage.json -w "%{http_code}" \
            "${{ env.PROD_API_URL }}/admin/summary/coverage" \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            --max-time 60)

          # Always seed sentinel outputs so downstream `fromJSON(...)` never
          # evaluates against an empty string (which silently skips the step
          # in GitHub Actions). A backend regression or payload-shape change
          # surfaces explicitly as drift=-1 → "report broken" issue.
          {
            echo "target_schema=unknown"
            echo "versions=0"
            echo "ok=0"
            echo "stale=0"
            echo "missing=0"
            echo "error=0"
            echo "drift=-1"
            echo "fetch_error="
          } >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Coverage endpoint returned HTTP $HTTP_CODE"
            head -c 1024 /tmp/coverage.json || true
            echo "fetch_error=Coverage endpoint returned HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            exit 0  # do NOT fail the step — let the "report broken" branch open an issue
          fi

          python3 -m json.tool < /tmp/coverage.json | head -20 || true
          echo "---"

          # Parse + emit totals. On ANY exception (truncated body, missing
          # keys, non-JSON 200 from a misconfigured edge), keep the sentinel
          # outputs and write a fetch_error message so the "report broken"
          # branch fires. Without this guard, a KeyError here would crash
          # the step and skip every downstream conditional — drift goes
          # silently unreported.
          python3 << 'PYEOF'
          import json, os, sys, traceback
          try:
              with open("/tmp/coverage.json") as f:
                  report = json.load(f)
              totals = report["totals"]
              drift = totals["stale"] + totals["missing"] + totals["error"]
              # majority_errored: when more than half the catalog's versions
              # report `kind=error`, the failure mode is almost certainly an
              # S3-route or IAM problem, NOT individual stale summaries.
              # `--fix` would dispatch workflows that all succeed at writing
              # to S3 without clearing the alert (operators chase the wrong
              # thing for a week). Surface this distinctly so a separate
              # P1 issue gets opened instead of edits-piling-up on the P2.
              majority_errored = totals["error"] >= max(1, totals["versions"] // 2)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"target_schema={report['target_schema']}\n")
                  out.write(f"versions={totals['versions']}\n")
                  out.write(f"ok={totals['ok']}\n")
                  out.write(f"stale={totals['stale']}\n")
                  out.write(f"missing={totals['missing']}\n")
                  out.write(f"error={totals['error']}\n")
                  out.write(f"drift={drift}\n")
                  out.write(f"majority_errored={'true' if majority_errored else 'false'}\n")
          except Exception as e:
              traceback.print_exc()
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"fetch_error=coverage payload malformed: {e}\n")
              sys.exit(0)  # fall through to the report-broken branch
          PYEOF

      - name: Build issue body
        if: fromJSON(steps.fetch.outputs.drift) > 0
        id: body
        run: |
          python3 << 'PYEOF'
          import json, os
          with open("/tmp/coverage.json") as f:
              report = json.load(f)

          lines = [
              f"## summary.json drift detected ({report['generated_at']})",
              "",
              f"- target schema: **{report['target_schema']}**",
              f"- total versions: **{report['totals']['versions']}**",
              f"- ok: **{report['totals']['ok']}**",
              f"- stale: **{report['totals']['stale']}**",
              f"- missing: **{report['totals']['missing']}**",
              f"- error: **{report['totals']['error']}**",
              "",
              "### Drifted versions",
              "",
              "| dataset_id | version | state | detail |",
              "| --- | --- | --- | --- |",
          ]
          for r in report["versions"]:
              s = r["state"]
              if s["kind"] == "ok":
                  continue
              if s["kind"] == "stale":
                  detail = f"schema {s['schema_version']}"
              elif s["kind"] == "missing":
                  detail = "summary.json absent"
              else:
                  detail = f"HTTP {s.get('status', '?')}: {s.get('message', '')}"
              lines.append(f"| {r['dataset_id']} | {r['version']} | {s['kind']} | {detail} |")

          lines += [
              "",
              "### Fix",
              "",
              "```",
              "nemar admin summary check --fix --yes",
              "```",
              "",
              "Or scope to a single dataset:",
              "",
              "```",
              "nemar admin summary check --id <dataset_id> --fix --yes",
              "```",
              "",
              "Dispatches re-run `generate-manifest` on `nemarDatasets/.github` for each drifted version. Re-run this workflow (or `nemar admin summary check`) after they complete to confirm drift cleared.",
          ]

          body = "\n".join(lines)
          # Use heredoc-style multi-line GITHUB_OUTPUT.
          delim = "EOF_BODY"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"body<<{delim}\n{body}\n{delim}\n")
          PYEOF

      - name: Define the retry helper
        # Each issue step below looks for an existing issue before it files one. A lookup that
        # FAILS must fail its step: reading an error as "no issue" files a duplicate every
        # week. But one transient API failure should not cost a week's alarm either, so each
        # lookup goes through `retry`: three attempts, five seconds apart, and it still fails
        # after the last. Steps share no shell state, so the function is written to a file
        # once and each step sources it.
        run: |
          cat > "$RUNNER_TEMP/retry.sh" << 'EOF'
          # retry COMMAND [ARGS...]: run it up to 3 times, RETRY_DELAY seconds apart (default 5),
          # and print the output of the first success. After the third failure it returns 1, so
          # `X=$(retry gh issue list ...)` under `set -e` still fails the step.
          retry() {
            local attempt=1 out
            until out=$("$@"); do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Giving up after 3 attempts: ${*:1:3}" >&2
                return 1
              fi
              echo "::warning::Attempt $attempt of 3 failed, retrying in ${RETRY_DELAY:-5}s: ${*:1:3}" >&2
              attempt=$((attempt + 1))
              sleep "${RETRY_DELAY:-5}"
            done
            printf '%s\n' "$out"
          }
          EOF

      - name: Ensure issue labels exist
        if: fromJSON(steps.fetch.outputs.drift) != 0
        # A failure here stays in the log and in the run's annotations, but the step and the
        # job stay green: with `continue-on-error` the runner reports the step as succeeded.
        # Failing the job instead trades a duplicate for a lost alarm: one label-API hiccup
        # would mean no issue at all this week. Nothing is hidden by letting the job go on:
        # a label that is really missing still fails `gh issue create --label` in the steps
        # below, and that failure is red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `drift` is a workflow-specific label that does not exist on a fresh
          # repo; P1 and P2 are the project's standard priority labels. Create
          # only the ones that are missing.
          #
          # This used to end each call in `>/dev/null 2>&1 || true`, which hid both
          # the missing `drift` label and the repository error above for twenty
          # weeks. Every failure is now printed, and every label is attempted
          # before the step reports failure.
          #
          # Not `gh label create --force`: with no --color it picks a RANDOM one,
          # so every run would recolor the existing P1 and P2 labels.
          LABELS=$(gh label list --limit 1000 --json name --jq '.[].name')
          failed=0
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if grep -qixF "$name" <<< "$LABELS"; then
              echo "Label '$name' exists."
            elif gh label create "$name" --color "$color" --description "$description"; then
              echo "Created label '$name'."
            else
              echo "::error::Could not create label '$name'."
              failed=1
            fi
          }
          ensure_label drift FBCA04 "summary.json drift detected by the weekly cron"
          ensure_label P1 ff6347 "High priority - important features, significant bugs"
          ensure_label P2 ffa500 "Normal priority - standard features and improvements"
          exit "$failed"

      - name: Open / update drift issue
        # Skip when majority_errored is true — that case opens its own P1
        # issue below ("probe broken") with a different remediation path.
        # Opening BOTH would just spam the operator with two issues for
        # the same root cause.
        if: fromJSON(steps.fetch.outputs.drift) > 0 && steps.fetch.outputs.majority_errored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT: ${{ steps.fetch.outputs.drift }}
          STALE: ${{ steps.fetch.outputs.stale }}
          MISSING: ${{ steps.fetch.outputs.missing }}
          ERROR_COUNT: ${{ steps.fetch.outputs.error }}
          ISSUE_BODY: ${{ steps.body.outputs.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/retry.sh"
          # The title and the lookup that finds it again share this one prefix, so they
          # cannot drift apart. It must not be a prefix of the probe-broken or report-broken
          # prefixes below, nor they of it (test/workflow-gh-calls.test.ts checks).
          PREFIX="summary.json drift:"
          TITLE="${PREFIX} ${DRIFT} version(s) need backfill"
          # Reuse the most recent open drift issue if one exists; otherwise open a fresh one.
          # A FAILED lookup fails the step (set -e above), after three attempts. It used to end
          # in `|| echo ""`, which turned an error into "no issue exists" and would have opened
          # a duplicate every Monday once the repository error was fixed. An empty RESULT is
          # fine and means there is none; an error is not.
          #
          # The match is on the TITLE PREFIX, not on the search text alone: the probe-broken
          # and report-broken issues carry the `drift` label too, and "summary.json drift"
          # appears in the title of one and the body of the other, so a bare search would
          # find one of them and rewrite it into a drift report.
          # The search text is the prefix without its colon, so it is not a third copy.
          EXISTING=$(retry gh issue list --label "drift" --state open --search "${PREFIX%:}" \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"${PREFIX}\"))] | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            # Update both title and body so the count in the title doesn't
            # rot when subsequent runs change how many versions are drifted.
            gh issue edit "$EXISTING" --title "$TITLE" --body "$ISSUE_BODY"
            echo "Updated existing drift issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$ISSUE_BODY" --label "drift,P2"
          fi

      - name: Open / update probe-broken issue
        # Fires when more than half the catalog's versions classify as
        # `error` — almost certainly an S3 route or IAM problem affecting
        # the read path, NOT individual stale summaries. `--fix` would
        # dispatch workflows that write to S3 successfully but never
        # clear the alert (the route still can't read what was written).
        # Separate P1 issue with the right remediation guidance.
        if: fromJSON(steps.fetch.outputs.drift) > 0 && steps.fetch.outputs.majority_errored == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERROR_COUNT: ${{ steps.fetch.outputs.error }}
          VERSIONS: ${{ steps.fetch.outputs.versions }}
          ISSUE_BODY: ${{ steps.body.outputs.body }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/retry.sh"
          PREFIX="summary.json probe failing"
          TITLE="${PREFIX} for majority of versions (${ERROR_COUNT}/${VERSIONS})"
          BODY=$'## Probe is failing for most versions\n\n'"$ISSUE_BODY"$'\n\n---\n\n**This is likely a `/<id>/<v>/summary.json` route or S3 IAM problem, NOT a backfill problem.** `nemar admin summary check --fix` will dispatch workflows that succeed at writing to S3 but the read path will keep returning error. Triage:\n\n1. Hit `https://data.nemar.org/<a-known-published-id>/v1.0.0/summary.json` directly. If it 5xx, that confirms route/IAM.\n2. Check the Worker error log for `[data] summary fetch failed`.\n3. Verify `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` Workers secrets are set + valid (`npx cfman wrangler --account sccn secret list -c backend/wrangler-sccn.toml`).\n\nTriggering workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # A failed lookup fails the step rather than reading as "no issue" (see the drift step).
          EXISTING=$(retry gh issue list --label "drift,P1" --state open --search "${PREFIX%:}" \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"${PREFIX}\"))] | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "drift,P1"
          fi
          exit 1  # Red badge — operator action required.

      - name: Open / update report-broken issue
        # Fires when the fetch step couldn't classify the result at all
        # (5xx from the coverage endpoint, payload schema regression, etc.).
        # We DELIBERATELY DO NOT roll up into the drift issue: a broken
        # report and an existing drift are two different operator alerts.
        if: fromJSON(steps.fetch.outputs.drift) == -1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_ERROR: ${{ steps.fetch.outputs.fetch_error }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/retry.sh"
          PREFIX="summary.json drift cron broken"
          TITLE="${PREFIX}"
          BODY=$'## Coverage endpoint or payload broken\n\n'"$FETCH_ERROR"$'\n\nThe weekly summary.json drift cron could not parse a coverage report. Run `nemar admin summary check --json` manually to triage. Triggering workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # A failed lookup fails the step rather than reading as "no issue" (see the drift step).
          EXISTING=$(retry gh issue list --label "drift,P1" --state open --search "${PREFIX%:}" \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"${PREFIX}\"))] | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "drift,P1"
          fi
          exit 1  # Surface the breakage in the workflow's red badge too.

      - name: Report clean
        if: fromJSON(steps.fetch.outputs.drift) == 0
        run: |
          echo "No drift detected. All ${{ steps.fetch.outputs.versions }} versions at schema ${{ steps.fetch.outputs.target_schema }}."
