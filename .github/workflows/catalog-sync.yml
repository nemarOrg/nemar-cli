name: Catalog Sync

# Sync the nemar.org dataset catalog into D1 + Vectorize every 4 hours.
# The nemar.org API requires GET with a JSON body, which Cloudflare Workers
# rejects. This Action fetches the catalog via curl and POSTs records
# to the backend's /admin/catalog/sync endpoint.

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:  # Manual trigger

env:
  # Centralized config: update these when URLs or versions change
  PROD_API_URL: https://api.osc.earth/nemar
  DEV_API_URL: https://nemar-api-dev.shirazi-10f.workers.dev
  NEMAR_API_URL: https://nemar.org/api/dataexplorer/datapipeline

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for package.json version)
        uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Read CLI version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "cli_version=$VERSION" >> $GITHUB_OUTPUT
          echo "CLI version: $VERSION"

      - name: Fetch nemar.org catalog
        id: fetch
        run: |
          # nemar.org requires GET with JSON body (non-standard).
          # Some curl versions strip the body on GET; use Python urllib as fallback.
          python3 << 'PYEOF'
          import json, sys, subprocess, os

          # Try curl first (some versions support GET with body)
          result = subprocess.run(
              ["curl", "-s", "-X", "GET",
               f"{os.environ.get('NEMAR_API_URL', 'https://nemar.org/api/dataexplorer/datapipeline')}/records",
               "-H", "Content-Type: application/json",
               "-d", '{"table_name":"dataexplorer_dataset","start":0,"limit":1000}'],
              capture_output=True, text=True, timeout=60
          )

          data = None
          if result.stdout.strip():
              try:
                  data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  print(f"curl response not valid JSON, trying http.client...")

          # Fallback: use http.client which supports GET with body
          if not data or not data.get("success"):
              import http.client
              conn = http.client.HTTPSConnection("nemar.org", timeout=60)
              body = json.dumps({"table_name": "dataexplorer_dataset", "start": 0, "limit": 1000})
              conn.request("GET", "/api/dataexplorer/datapipeline/records", body=body,
                           headers={"Content-Type": "application/json",
                                    "User-Agent": "nemar-cli/catalog-sync"})
              resp = conn.getresponse()
              raw = resp.read().decode()
              print(f"http.client response: status={resp.status}, length={len(raw)}")
              if not raw.strip():
                  print(f"::error::nemar.org returned empty response (HTTP {resp.status})")
                  print(f"Response headers: {dict(resp.getheaders())}")
                  sys.exit(1)
              data = json.loads(raw)
              conn.close()

          if not data.get("success"):
              print(f"::error::nemar.org API returned unsuccessful response: {data.get('error', 'unknown')}")
              sys.exit(1)

          entries = data.get("entries", {})
          records = [v for v in entries.values() if v.get("id")]
          print(f"Fetched {data.get('total', 0)} records, {len(records)} valid")

          # Wrap in {"records": [...]} for the admin endpoint
          with open("/tmp/catalog-records.json", "w") as f:
              json.dump({"records": records}, f)

          # Write count to GITHUB_OUTPUT
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={len(records)}\n")
          PYEOF

      - name: Push to production backend
        if: fromJSON(steps.fetch.outputs.count) > 0
        env:
          ADMIN_API_KEY: ${{ secrets.PROD_ADMIN_API_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/prod-response.json -w "%{http_code}" -X POST \
            "${{ env.PROD_API_URL }}/admin/catalog/sync" \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            -H "X-CLI-Version: ${{ steps.version.outputs.cli_version }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/catalog-records.json \
            --max-time 120)

          RESPONSE=$(cat /tmp/prod-response.json)
          echo "Production sync response (HTTP $HTTP_CODE):"
          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Production backend returned HTTP $HTTP_CODE"
            exit 1
          fi

          SYNCED=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('records_synced',0))")
          INDEXED=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('records_indexed',0))")
          echo "Synced: $SYNCED, Indexed: $INDEXED"

          if [ "$SYNCED" -eq 0 ]; then
            echo "::error::Production sync reported 0 records synced"
            exit 1
          fi

      - name: Push to dev backend
        if: fromJSON(steps.fetch.outputs.count) > 0
        env:
          ADMIN_API_KEY: ${{ secrets.TEST_ADMIN_API_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/dev-response.json -w "%{http_code}" -X POST \
            "${{ env.DEV_API_URL }}/admin/catalog/sync" \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            -H "X-CLI-Version: ${{ steps.version.outputs.cli_version }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/catalog-records.json \
            --max-time 120)

          RESPONSE=$(cat /tmp/dev-response.json)
          echo "Dev sync response (HTTP $HTTP_CODE):"
          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::Dev backend returned HTTP $HTTP_CODE (non-fatal)"
          fi
