name: Deploy Backend

on:
  # Production: every push to main that touches the backend, or the validator pin the
  # Worker bundles (backend/src/services/github/shared.ts reads validator-version.json
  # from the repository root), so a change to the pin alone redeploys the Worker.
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'validator-version.json'
      - '.github/workflows/deploy-backend.yml'
  # The dev worker: called by auto-bump-dev.yml, ONCE per push to dev, after it has
  # pushed the version bump, with the commit to deploy (the bump). Until 2026-10, a
  # push to dev deployed itself here, so a merge touching backend/ or shared/
  # deployed twice: the merge commit at -devN, then 14 s later the bump at -devN+1,
  # each behind its own 18-minute test-gate (152 of 235 deploy runs were bump
  # commits, 2026-09-15 to 2026-10-13). The dev worker now ends at the same bumped
  # version from one deploy. auto-bump-dev.yml still deploys a push it does not
  # bump, when that push touched the paths above.
  #
  # A call, not a dispatch: a reusable workflow runs from the caller's own commit,
  # so it does not depend on what main's copy of this file declares.
  workflow_call:
    inputs:
      sha:
        description: "Commit on dev to deploy"
        type: string
        required: true
  # By hand, to redeploy dev: gh workflow run deploy-backend.yml --ref dev
  # [-f sha=<commit on dev>]. A call or dispatch from any other ref deploys nothing
  # (see detect-environment), so neither adds a way to reach production.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on dev to deploy (default: the head of dev)"
        required: false
        default: ""

# Serialize deploys per ref (#897). The release pipeline pushes TWO commits to
# main that both match backend/** (the dev->main merge commit writes
# backend/package.json's version, and auto-tag.yml's strip commit rewrites it
# again seconds later). Without this group both fired `wrangler d1 migrations
# apply` + `wrangler deploy` to PRODUCTION in parallel. cancel-in-progress:false
# so a queued deploy WAITS for the in-flight one to finish its migrate+deploy
# rather than cancelling it mid-migration (a cancelled prod migration is worse
# than a slightly stale deploy; the queued run then deploys the newer commit).
# A dispatched dev deploy runs on ref dev and takes the dev group. A call from
# auto-bump-dev.yml evaluates this group in its caller's context (also dev);
# whether it then applies to the call is not documented, which is why the
# caller serializes its calls and deploy-dev takes a job-level lock as well.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect which environment to deploy to
  detect-environment:
    runs-on: ubuntu-latest
    # p95 4 s (50 green runs to 2026-10-13); 10 is the floor.
    timeout-minutes: 10
    permissions:
      actions: read # the release merge commit's deploy run, below
      contents: read
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      # The commit every job below checks out: the pushed commit on main, the
      # given `sha` (or the head of dev) for the dev worker.
      sha: ${{ steps.detect.outputs.sha }}
      # 'true' when test-gate is skipped because the commit before passed it.
      gate_reused: ${{ steps.reuse.outputs.gate_reused }}
    steps:
      # A called run carries its caller's event (a push to dev), hence the ref test.
      - name: Checkout code
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Classify the push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci/classify-push.sh >> "$GITHUB_OUTPUT"

      - name: Detect environment
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # A call from auto-bump-dev.yml always passes `sha`; a dispatch may not.
          if [[ -n "$INPUT_SHA" || "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/dev" ]]; then
              echo "::notice::a deploy called or dispatched from $REF deploys nothing; only dev's is the dev worker"
              exit 0
            fi
            SHA="${INPUT_SHA:-$GITHUB_SHA}"
            if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::sha '$SHA' is not a full commit id"
              exit 1
            fi
            # Only a commit dev already holds: the dev worker deploys only from dev.
            STATUS=$(gh api "repos/$GH_REPO/compare/$SHA...dev" --jq .status)
            if [[ "$STATUS" != "ahead" && "$STATUS" != "identical" ]]; then
              echo "::error::$SHA is not on dev (compare status '$STATUS'); refusing to deploy it"
              exit 1
            fi
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$EVENT on $REF deploys nothing: production deploys on a push to main, dev when auto-bump-dev.yml calls this"
          fi

      # THE RELEASE STRIP COMMIT REUSES THE RELEASE MERGE'S GATE. A release pushes
      # two commits to main: the dev -> main merge, then auto-tag.yml's commit that
      # only strips -devN from the version. Both deploy (see the note on concurrency
      # above), and each ran the full 18-minute test-gate over the same code. When
      # this push is that strip commit (the bot's single version-only commit on top
      # of the previous head, scripts/ci/classify-push.sh) and the previous head's
      # own deploy run passed test-gate, this run skips it. The concurrency group
      # means that run has finished by the time this one starts. In every other
      # case, including any doubt or API failure, test-gate runs as before.
      - name: Reuse the previous commit's gate
        id: reuse
        if: steps.detect.outputs.environment == 'production' && steps.push.outputs.auto_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/deploy-backend.yml/runs?head_sha=$BEFORE&event=push&branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id // empty') || run_id=""
          gate=""
          if [ -n "$run_id" ]; then
            gate=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "test-gate")][0].conclusion // empty') || gate=""
          fi
          if [ "$gate" = "success" ]; then
            echo "gate_reused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::test-gate skipped: $BEFORE passed it in run $run_id, and this push only changes the version"
          else
            echo "gate_reused=false" >> "$GITHUB_OUTPUT"
            echo "test-gate runs: the deploy run of $BEFORE is '${run_id:-not found}', its test-gate '${gate:-unknown}'"
          fi

  # Gate (#897): the exact commit being deployed must pass the same required
  # tier test.yml enforces for landing (typecheck + lint + pure unit tests)
  # BEFORE it can reach dev or prod. test.yml runs on PRs/pushes, but nothing
  # previously stopped a direct push (or an unreviewed merge) from deploying a
  # red build straight to production. Both deploy jobs `needs:` this, so a
  # failing gate blocks the deploy instead of racing it.
  test-gate:
    needs: detect-environment
    if: needs.detect-environment.outputs.environment != '' && needs.detect-environment.outputs.gate_reused != 'true'
    runs-on: ubuntu-latest
    # p95 21.8 min (50 green runs to 2026-10-13), so twice that.
    timeout-minutes: 44
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-environment.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Under 30 s at p95, but the Ubuntu mirror can stall on this one package for minutes,
      # and #1667 saw the same install hang for an hour.
      - name: Install git-annex
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex

      - name: Install dependencies
        run: bun install

      - name: Install backend dependencies
        run: cd backend && bun install

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Run pure unit tests (no live backend)
        run: |
          # Same auto-classification as test.yml's required unit-pure tier: every
          # non-e2e test file that does NOT hit the live backend. Kept in lockstep
          # with test.yml so the deploy gate and the PR gate assert the same set.
          shopt -s nullglob
          files=()
          for f in test/*.test.ts backend/test/*.test.ts backend/test/helpers/*.test.ts; do
            base="$(basename "$f")"
            case "$base" in
              e2e-sandbox.test.ts|e2e-upload.test.ts|zenodo-sandbox.test.ts|ezid.test.ts|ezid-sandbox.test.ts|auth-passwordless.test.ts) continue;;
              # *.integration.test.ts hit external networks (live DataCite/Crossref);
              # they are non-deterministic and must never gate the prod deploy.
              *.integration.test.ts) continue;;
            esac
            if grep -Eq 'testRequest|TEST_API_URL|runCli\(' "$f"; then continue; fi
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then echo "No pure test files matched" >&2; exit 1; fi
          echo "Running ${#files[@]} pure test files"
          bun test "${files[@]}"

  deploy-dev:
    needs: [detect-environment, test-gate]
    # Must check test-gate.result explicitly: a job with its OWN `if:` loses the
    # implicit "all needs succeeded" gate, so without this a FAILED test-gate
    # would not block the deploy (the whole point of #897).
    if: needs.detect-environment.outputs.environment == 'dev' && needs.test-gate.result == 'success'
    runs-on: ubuntu-latest
    # p95 0.9 min (42 green runs to 2026-10-13). 20, not the 10 floor: the two smoke
    # loops below can take 7 minutes on their own, and a limit that cancels a D1
    # migration midway is worse than a slow deploy (see the concurrency note above).
    timeout-minutes: 20
    # A lock on the dev migrate and deploy themselves, whatever started them (a
    # call from auto-bump-dev.yml or a dispatch), with the same never-cancel-midway
    # rule as the workflow-level group above.
    concurrency:
      group: deploy-backend-dev-worker
      cancel-in-progress: false
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-environment.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Root install first (#958). backend/src imports ../../../../shared/contract,
      # so shared/*.ts joins the typecheck graph, and TypeScript resolves a module
      # relative to the IMPORTING file: `zod` inside shared/ is looked up in
      # shared/node_modules then the repo-root node_modules, never
      # backend/node_modules. A backend-only install therefore fails typecheck with
      # TS2307 for zod. test.yml already installs at both levels; this matches it.
      - name: Install dependencies (root, for shared/)
        run: bun install

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Type check
        working-directory: backend
        run: bun run typecheck

      - name: Apply D1 migrations (dev)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Dev has its own D1 database (nemar-db-dev) since v0.7.21.
        run: npx wrangler d1 migrations apply nemar-db-dev --remote --env dev -c wrangler-sccn.toml

      - name: Deploy to Cloudflare Workers (dev)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev -c wrangler-sccn.toml

      # Post-deploy smoke. `wrangler deploy` exiting 0 does NOT prove the new code
      # is serving: #958 showed deploy-backend can fail EARLIER (typecheck) and,
      # more importantly, a green deploy step with nothing asserting the running
      # Worker let dev run 2026-07-06 code for 11 days unnoticed. /health reports
      # pkg.version (../../package.json), so requiring it to equal the just-deployed
      # version proves the new build is live. Fails the job (goes red) otherwise.
      - name: Smoke test dev worker (/health version must match the deploy)
        run: |
          EXPECTED="$(jq -r .version package.json)"
          URL="https://nemar-api-dev.sccn-org.workers.dev/health"
          echo "Expecting /health version $EXPECTED at $URL"
          GOT=""
          for i in $(seq 1 12); do
            BODY="$(curl -fsS --max-time 15 "$URL" 2>/dev/null || true)"
            GOT="$(printf '%s' "$BODY" | jq -r '.version // empty' 2>/dev/null || true)"
            [ "$GOT" = "$EXPECTED" ] && { echo "::notice::Dev worker healthy at $GOT (attempt $i)"; exit 0; }
            echo "attempt $i: got '${GOT:-<none>}', want '$EXPECTED'; retrying in 10s"
            sleep 10
          done
          echo "::error::Dev deploy smoke FAILED - /health never reported $EXPECTED (last '${GOT:-<none>}'). The deploy likely silently failed; do NOT assume dev is current."
          exit 1

      # The private site's grant route (ADR 0079) must be routed on the build
      # that just went live: an anonymous POST with an allowed Origin answers
      # 401. A 404 means the route is missing from what deployed, which the
      # /health check above cannot see. Runs after it, so the new version is
      # already the one serving, but not necessarily at every edge: a request
      # can land on one that still serves the previous version for a few
      # seconds after `wrangler deploy`. So a network failure, a 5xx and a 404
      # are retried, and a 404 fails the job only when the last attempt still
      # answers it.
      #
      # ONE EXCEPTION: in maintenance mode (backend/src/middleware/maintenance.ts)
      # every POST answers 503 with `error: "Service Unavailable"` and `mode`
      # `read-only` or `full`, so the route cannot be verified at all. That is
      # a warning, not a failed deploy. Any other 503 is still a failure.
      - name: Smoke test dev worker (/auth/private/grant must answer 401)
        run: |
          URL="https://nemar-api-dev.sccn-org.workers.dev/auth/private/grant"
          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"
          CODE=""
          # What the last attempt got back, so a failure does not read as a bare
          # status code (a zone bot or WAF challenge shows as `cf-mitigated`).
          show_last() {
            echo "::group::last response (status ${CODE:-<none>})"
            head -c 2000 "$HEADER_FILE" 2>/dev/null || true
            echo
            head -c 2000 "$BODY_FILE" 2>/dev/null || true
            echo
            echo "::endgroup::"
          }
          for i in $(seq 1 3); do
            CODE="$(curl -sS -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' --max-time 15 -X POST \
              -H 'Origin: https://app.nemar.org' -H 'Content-Type: application/json' \
              "$URL" || true)"
            echo "attempt $i: POST $URL -> ${CODE:-<none>}"
            case "$CODE" in
              401) echo "::notice::Dev private grant route is live (401 to an anonymous caller)"; exit 0 ;;
              404)
                if [ "$i" -eq 3 ]; then
                  show_last
                  echo "::error::Dev deploy smoke FAILED - POST $URL answered 404 on every attempt: the private grant route is not in the deployed build."
                  exit 1
                fi
                sleep 10 ;;
              503)
                if jq -e '.error == "Service Unavailable" and (.mode == "read-only" or .mode == "full")' "$BODY_FILE" >/dev/null 2>&1; then
                  MODE="$(jq -r .mode "$BODY_FILE")"
                  echo "::warning::Dev private grant route is unverifiable: the API is in maintenance mode ($MODE), which refuses every POST. Re-check it once maintenance ends."
                  exit 0
                fi
                sleep 10 ;;
              ""|000|5*) sleep 10 ;;
              *) break ;;
            esac
          done
          show_last
          echo "::error::Dev deploy smoke FAILED - POST $URL answered ${CODE:-<none>}, want 401."
          exit 1

  deploy-production:
    needs: [detect-environment, test-gate]
    # Explicit test-gate.result check (see deploy-dev): a custom `if:` drops the
    # implicit needs-success gate, so this is what actually blocks a prod deploy
    # on a red build. `!cancelled()` lets this job run when test-gate was skipped,
    # which it is only when detect-environment found the gate already passed for
    # this exact code (the release strip commit, see "Reuse the previous commit's
    # gate"); any other skip, a failure or a cancellation still blocks the deploy.
    if: >-
      !cancelled()
      && needs.detect-environment.outputs.environment == 'production'
      && (needs.test-gate.result == 'success'
          || (needs.test-gate.result == 'skipped' && needs.detect-environment.outputs.gate_reused == 'true'))
    runs-on: ubuntu-latest
    # p95 0.7 min (8 green runs to 2026-10-13); 20 for the same reasons as deploy-dev.
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-environment.outputs.sha }}
          # Full history + tags so the drift check below can resolve whether the
          # deployed commit is a tagged release.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Root install first (#958). backend/src imports ../../../../shared/contract,
      # so shared/*.ts joins the typecheck graph, and TypeScript resolves a module
      # relative to the IMPORTING file: `zod` inside shared/ is looked up in
      # shared/node_modules then the repo-root node_modules, never
      # backend/node_modules. A backend-only install therefore fails typecheck with
      # TS2307 for zod. test.yml already installs at both levels; this matches it.
      - name: Install dependencies (root, for shared/)
        run: bun install

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: Type check
        working-directory: backend
        run: bun run typecheck

      - name: Apply D1 migrations (production)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nemar-db --remote -c wrangler-sccn.toml

      - name: Deploy to Cloudflare Workers (production)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-sccn.toml

      # Post-deploy smoke on PRODUCTION. This is the guard the release most needs:
      # after the dev->main deploy, require api.nemar.org/health to report the
      # just-deployed version so a silently-failed prod deploy goes RED instead of
      # leaving prod on old code. The release deploys twice (pre-strip -devN, then
      # the stripped tag), and each job checks out its own commit, so EXPECTED is
      # always that deploy's own package.json version.
      - name: Smoke test production worker (/health version must match the deploy)
        run: |
          EXPECTED="$(jq -r .version package.json)"
          URL="https://api.nemar.org/health"
          echo "Expecting /health version $EXPECTED at $URL"
          GOT=""
          for i in $(seq 1 12); do
            BODY="$(curl -fsS --max-time 15 "$URL" 2>/dev/null || true)"
            GOT="$(printf '%s' "$BODY" | jq -r '.version // empty' 2>/dev/null || true)"
            [ "$GOT" = "$EXPECTED" ] && { echo "::notice::Production healthy at $GOT (attempt $i)"; exit 0; }
            echo "attempt $i: got '${GOT:-<none>}', want '$EXPECTED'; retrying in 10s"
            sleep 10
          done
          echo "::error::PRODUCTION deploy smoke FAILED - /health never reported $EXPECTED (last '${GOT:-<none>}'). Prod may be running old code; investigate and roll back immediately."
          exit 1

      # The private site's grant route (ADR 0079) must be routed on the build
      # that just went live: an anonymous POST with an allowed Origin answers
      # 401. A 404 means the route is missing from what deployed, which the
      # /health check above cannot see. Runs after it, so the new version is
      # already the one serving, but not necessarily at every edge: a request
      # can land on one that still serves the previous version for a few
      # seconds after `wrangler deploy`. So a network failure, a 5xx and a 404
      # are retried, and a 404 fails the job only when the last attempt still
      # answers it.
      #
      # ONE EXCEPTION: in maintenance mode (backend/src/middleware/maintenance.ts)
      # every POST answers 503 with `error: "Service Unavailable"` and `mode`
      # `read-only` or `full`, so the route cannot be verified at all. That is
      # a warning, not a failed deploy. Any other 503 is still a failure.
      - name: Smoke test production worker (/auth/private/grant must answer 401)
        run: |
          URL="https://api.nemar.org/auth/private/grant"
          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"
          CODE=""
          # What the last attempt got back, so a failure does not read as a bare
          # status code. Production goes through the api.nemar.org custom domain,
          # which the dev check never exercises, so a zone bot or WAF challenge
          # on this POST would show here as `cf-mitigated`.
          show_last() {
            echo "::group::last response (status ${CODE:-<none>})"
            head -c 2000 "$HEADER_FILE" 2>/dev/null || true
            echo
            head -c 2000 "$BODY_FILE" 2>/dev/null || true
            echo
            echo "::endgroup::"
          }
          for i in $(seq 1 3); do
            CODE="$(curl -sS -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' --max-time 15 -X POST \
              -H 'Origin: https://app.nemar.org' -H 'Content-Type: application/json' \
              "$URL" || true)"
            echo "attempt $i: POST $URL -> ${CODE:-<none>}"
            case "$CODE" in
              401) echo "::notice::PRODUCTION private grant route is live (401 to an anonymous caller)"; exit 0 ;;
              404)
                if [ "$i" -eq 3 ]; then
                  show_last
                  echo "::error::PRODUCTION deploy smoke FAILED - POST $URL answered 404 on every attempt: the private grant route is not in the deployed build."
                  exit 1
                fi
                sleep 10 ;;
              503)
                if jq -e '.error == "Service Unavailable" and (.mode == "read-only" or .mode == "full")' "$BODY_FILE" >/dev/null 2>&1; then
                  MODE="$(jq -r .mode "$BODY_FILE")"
                  echo "::warning::PRODUCTION private grant route is unverifiable: the API is in maintenance mode ($MODE), which refuses every POST. Re-check it once maintenance ends."
                  exit 0
                fi
                sleep 10 ;;
              ""|000|5*) sleep 10 ;;
              *) break ;;
            esac
          done
          show_last
          echo "::error::PRODUCTION deploy smoke FAILED - POST $URL answered ${CODE:-<none>}, want 401."
          exit 1

      - name: Check release-tag drift (informational)
        # Surfaces git-tag vs running-Worker drift (#897). The release pipeline
        # deploys the pre-strip merge commit first (untagged) and then the
        # auto-tag strip commit (tagged) -- serialized by the concurrency group
        # above -- so an untagged deploy here is EXPECTED as the first of the
        # pair and only worth attention if no tagged deploy follows. Never fails
        # the deploy; just annotates the run so tag/worker drift is visible.
        run: |
          SHA="$(git rev-parse --short HEAD)"
          if TAG="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "::notice::Deployed production at tagged release ${TAG} (${SHA})."
          else
            echo "::warning::Deployed production commit ${SHA} has no matching release tag. Expected for the pre-strip merge commit (the auto-tag strip commit deploys the tagged version next). If no tagged deploy follows, prod is running an untagged build."
          fi
