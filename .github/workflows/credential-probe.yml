name: Credential Probe

# Daily check of the long-lived GitHub-token secrets this repo depends on.
# `e2e-upload` has failed on every release since v0.10.0 (#1321, and #1022
# before it) because GH_TOKEN quietly expired between releases, surfacing
# only as two cryptic "Bad credentials (HTTP 401)" test failures on release
# day. This workflow runs the same probe (scripts/ci/probe-github-token.ts)
# on a schedule with --fail-days set, so an expiring token is caught with
# two weeks of runway instead of on the day it blocks a release.
#
# A FAILING SCHEDULED RUN IS THE POINT: GitHub emails workflow-run failure
# notifications to the repository watchers / the workflow's actor, so a red
# run here is the early warning, not a problem to route around.
#
# A NEW file rather than an addition to test.yml or nightly-tests.yml: both
# are being edited concurrently by other work on their test-list loops, and
# this workflow's schedule/job shape has nothing in common with either.
#
# NOTE: scheduled workflows only fire from the repository's default branch
# (main), so the daily cron activates once this file reaches main. Trigger
# it by hand with workflow_dispatch in the meantime, or to test a change.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily (~06:00 PT)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: credential-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe long-lived GitHub-token secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      # Each probe is `continue-on-error` so one dead secret doesn't hide the
      # state of the other two; the final step below fails the job (and so
      # triggers the failure notification) if any probe above failed.

      # GH_TOKEN: a nemarAdmin user PAT (never a GitHub App token -- the
      # upload flow it backs accepts collaborator invitations, pushes, and
      # opens PRs as the user; `gh api user` 403s for an installation
      # token). Scopes established from issue #1022 and the e2e-upload job.
      - name: Probe GH_TOKEN
        id: probe-gh-token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          bun run scripts/ci/probe-github-token.ts GH_TOKEN \
            --owner nemarAdmin \
            --require-scopes repo,workflow \
            --fail-days 14 \
            --issue 1321

      # AUTO_TAG_PAT: pushes release/bump commits to protected main/dev
      # branches and creates GitHub Releases (auto-tag.yml, auto-bump-dev.yml,
      # sync-dev.yml). Scope established from those workflows' comments; the
      # account that owns it is not recorded anywhere in this repo.
      - name: Probe AUTO_TAG_PAT
        id: probe-auto-tag-pat
        continue-on-error: true
        env:
          AUTO_TAG_PAT: ${{ secrets.AUTO_TAG_PAT }}
        run: |
          bun run scripts/ci/probe-github-token.ts AUTO_TAG_PAT \
            --owner unknown \
            --require-scopes repo \
            --fail-days 14

      # DOCS_READ_TOKEN: read-only fallback for checking out the private
      # nemarOrg/docs content tree (ADR 0059, test.yml's docs checkout step).
      # It may be a fine-grained PAT scoped to that one repo, in which case
      # GitHub omits the scopes header entirely and the scope check below is
      # a no-op (absent is treated as unknown, never as a failure). The
      # owning account is not recorded anywhere in this repo.
      - name: Probe DOCS_READ_TOKEN
        id: probe-docs-read-token
        continue-on-error: true
        env:
          DOCS_READ_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
        run: |
          bun run scripts/ci/probe-github-token.ts DOCS_READ_TOKEN \
            --owner unknown \
            --require-scopes repo \
            --fail-days 14

      - name: Fail if any probe failed
        if: always()
        run: |
          status=0
          if [ "${{ steps.probe-gh-token.outcome }}" != "success" ]; then
            echo "::error::GH_TOKEN probe failed (see the step above)."
            status=1
          fi
          if [ "${{ steps.probe-auto-tag-pat.outcome }}" != "success" ]; then
            echo "::error::AUTO_TAG_PAT probe failed (see the step above)."
            status=1
          fi
          if [ "${{ steps.probe-docs-read-token.outcome }}" != "success" ]; then
            echo "::error::DOCS_READ_TOKEN probe failed (see the step above)."
            status=1
          fi
          exit "$status"
